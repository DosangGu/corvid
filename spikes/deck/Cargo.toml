[package]
name = "corvid-deck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "corvid-deck"

[features]
default = ["desktop"]
desktop = ["live", "dep:corvid-companion", "dep:gpui", "dep:tokio"]
live = ["dep:anyhow", "dep:corvid-presentation", "dep:corvid-protocol", "dep:uuid"]
stream-deck = ["live", "dep:hidapi", "dep:image", "dep:resvg"]

[[bin]]
name = "corvid-deck"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "corvid-streamdeck"
path = "src/bin/streamdeck/main.rs"
required-features = ["stream-deck"]

[dependencies]
anyhow = { workspace = true, optional = true }
corvid-presentation = { workspace = true, optional = true }
corvid-protocol = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
corvid-companion = { workspace = true, optional = true }
gpui = { workspace = true, features = ["windows-manifest"], optional = true }
hidapi = { workspace = true, optional = true }
image = { workspace = true, features = ["bmp", "jpeg"], optional = true }
resvg = { workspace = true, features = ["system-fonts", "text"], optional = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"], optional = true }

[build-dependencies]
embed-resource.workspace = true
