[advisories]
# Report unmaintained/yanked crates in the separate informational CI step;
# hard-fail PRs and scheduled runs on security vulnerabilities and unsoundness.
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # Transitive-only via gpui/scheduler (direct corvid-desktop usage removed in #456); tracked in #526.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained transitive gpui/scheduler dependency tracked in #526" },
]
