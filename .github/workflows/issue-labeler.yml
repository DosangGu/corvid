name: Issue Labeler

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

concurrency:
  group: issue-labeler-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        with:
          configuration-path: .github/issue-labeler.yml
          enable-versioned-regex: 0
          include-title: 1
          include-body: 0
          sync-labels: 0
          repo-token: ${{ github.token }}
