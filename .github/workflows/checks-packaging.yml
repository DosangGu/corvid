name: Checks / Packaging

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checks-packaging.yml'
      - '.gitattributes'
      - 'assets/**'
      - 'LICENSE'
      - 'crates/corvid-update/**'
      - 'crates/corvid-client/src/endpoint/bootstrap*'
      - 'crates/corvid-client/src/endpoint/install_windows.ps1'
      - 'crates/corvid-client/src/upgrade.rs'
      - 'crates/corvid-daemon/src/upgrade.rs'
      - 'crates/corvid-desktop/src/workspace_view/update.rs'
      - 'crates/corvid-desktop/src/workspace_view/update/**'
      - 'crates/corvid-protocol/src/upgrade.rs'
      - 'crates/corvid-tui/src/update.rs'
      - 'crates/corvid-tui/assets/**'
      - 'plugins/agent-deck/assets/**'
      - 'deploy/cargo-desktop/**'
      - 'deploy/crates_io.py'
      - 'deploy/install.*'
      - 'deploy/linux/**'
      - 'deploy/macos/**'
      - 'deploy/macos_dock_fixture.swift'
      - 'deploy/*package*.py'
      - 'deploy/release.py'
      - 'deploy/systemd/**'
      - 'deploy/test_icons.py'
      - 'deploy/test_install.py'
      - 'deploy/test_macos.py'
      - 'deploy/test_macos_dock_update.py'
      - 'deploy/test_native.py'
      - 'deploy/windows/**'

permissions:
  contents: read

concurrency:
  group: checks-packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging:
    name: Packaging scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check icons and package manifests
        run: |
          python3 deploy/test_icons.py
          python3 deploy/test_package.py
          python3 deploy/test_macos_package.py
      - name: Check installer shell syntax
        run: |
          for script in deploy/install.sh deploy/linux/*.sh deploy/macos/*.sh; do
            bash -n "$script"
          done
