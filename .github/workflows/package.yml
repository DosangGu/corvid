name: Package Corvid

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  MACOSX_DEPLOYMENT_TARGET: '15.0'
  PYTHONUNBUFFERED: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 deploy/release.py validate
      - run: python3 deploy/test_icons.py
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: cargo fmt --all -- --check

  native:
    needs: validate
    uses: ./.github/workflows/native.yml
    with:
      package: true
      # The installer jobs test the packaged UI on both qualification and tags.
      qualify: &qualify ${{ github.event_name != 'push' || github.ref_type != 'tag' }}

  linux-installers:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            native: x86_64-unknown-linux-musl
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            native: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux Desktop integration dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update --error-on=any
          sudo apt-get -o Acquire::Retries=3 install -y libxcb1 libxkbcommon0 libxkbcommon-x11-0 libudev1 libfontconfig1 libssl3t64 libvulkan1 mesa-vulkan-drivers xvfb xauth x11-utils xdotool xclip desktop-file-utils openbox scrot
          mkdir -p "$HOME/.corvid-tests"
          chmod 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      # TODO: Update download-artifact once ZIP extraction stops emitting DEP0005
      # Track https://github.com/actions/toolkit/issues/2003 and update the workflow pins when a fixed download-artifact release is available.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: target/runtimes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: binaries-desktop-${{ matrix.target }}
          path: target/desktop-binaries
      - name: Package Desktop with all runtimes
        run: python deploy/package.py package --product desktop --target ${{ matrix.target }} --runtime target/runtimes/runtime-${{ matrix.native }} --linux-runtime target/runtimes/runtime-x86_64-unknown-linux-musl --windows-runtime target/runtimes/runtime-x86_64-pc-windows-msvc --linux-arm64-runtime target/runtimes/runtime-aarch64-unknown-linux-musl --windows-arm64-runtime target/runtimes/runtime-aarch64-pc-windows-msvc --macos-runtime target/runtimes/runtime-aarch64-apple-darwin --build target/desktop-binaries --output target/dist
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Install Rust target for installer fixtures
        run: rustup target add ${{ matrix.target }}
      - name: Desktop package installation
        if: *qualify
        run: python deploy/test_install.py --assets target/dist --binary target/runtimes/runtime-${{ matrix.native }}/corvid --product desktop
      - name: Linux packaged UI smoke tests
        timeout-minutes: 10
        run: python3 tests/ui/run.py --assets target/dist
      - name: Linux packaged Desktop lifecycle
        if: *qualify
        timeout-minutes: 10
        run: python3 tests/ui/run.py --assets target/dist --case desktop-lifecycle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: packaged-ui-failure-${{ matrix.target }}
          path: target/ui-tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-${{ matrix.target }}
          path: target/dist/
          if-no-files-found: error

  windows-installers:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            native: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            native: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: target/runtimes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: binaries-desktop-${{ matrix.target }}
          path: target/desktop-binaries
      - name: Verify Windows executable icons
        run: python deploy/test_icons.py --build target/desktop-binaries --runtime target/runtimes/runtime-${{ matrix.native }}/corvid.exe
      - name: Package Desktop with all runtimes
        run: python deploy/package.py package --product desktop --target ${{ matrix.target }} --runtime target/runtimes/runtime-${{ matrix.native }} --linux-runtime target/runtimes/runtime-x86_64-unknown-linux-musl --windows-runtime target/runtimes/runtime-x86_64-pc-windows-msvc --linux-arm64-runtime target/runtimes/runtime-aarch64-unknown-linux-musl --windows-arm64-runtime target/runtimes/runtime-aarch64-pc-windows-msvc --macos-runtime target/runtimes/runtime-aarch64-apple-darwin --build target/desktop-binaries --output target/dist
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Install Rust target for installer fixtures
        run: rustup target add ${{ matrix.target }}
      - name: Desktop package installation
        if: *qualify
        run: python deploy/test_install.py --assets target/dist --binary target/runtimes/runtime-${{ matrix.native }}/corvid.exe --product desktop
      - name: Windows packaged UI smoke tests
        timeout-minutes: 10
        run: python tests/ui/run.py --assets target/dist
      - name: Build Windows Setup
        id: windows-setup
        shell: pwsh
        run: |
          $compiler = ./deploy/windows/Get-InnoCompiler.ps1 -Directory target/inno
          $archive = (Get-ChildItem target/dist -Filter 'corvid-desktop-*.zip').FullName
          python deploy/native_package.py --archive $archive --output target/dist --iscc $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_OUTPUT "compiler=$compiler"
      - name: Test Windows Setup
        if: *qualify
        env:
          INNO_COMPILER: ${{ steps.windows-setup.outputs.compiler }}
        shell: pwsh
        run: |
          $archive = (Get-ChildItem target/dist -Filter 'corvid-desktop-*.zip').FullName
          $setup = (Get-ChildItem target/dist -Filter '*-setup.exe').FullName
          python deploy/test_native.py --archive $archive --package $setup --iscc $env:INNO_COMPILER
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: packaged-ui-failure-${{ matrix.target }}
          path: target/ui-tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-${{ matrix.target }}
          path: target/dist/
          if-no-files-found: error

  macos-installers:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            native: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: target/runtimes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: binaries-desktop-${{ matrix.target }}
          path: target/desktop-binaries
      - name: Package Desktop with all runtimes
        run: python deploy/package.py package --product desktop --target ${{ matrix.target }} --runtime target/runtimes/runtime-${{ matrix.native }} --linux-runtime target/runtimes/runtime-x86_64-unknown-linux-musl --windows-runtime target/runtimes/runtime-x86_64-pc-windows-msvc --linux-arm64-runtime target/runtimes/runtime-aarch64-unknown-linux-musl --windows-arm64-runtime target/runtimes/runtime-aarch64-pc-windows-msvc --macos-runtime target/runtimes/runtime-aarch64-apple-darwin --build target/desktop-binaries --output target/dist
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Install Rust target for installer fixtures
        run: rustup target add ${{ matrix.target }}
      - name: Desktop package installation
        if: *qualify
        run: python deploy/test_install.py --assets target/dist --binary target/runtimes/runtime-${{ matrix.native }}/corvid --product desktop
      - name: Build unsigned macOS DMG
        run: python3 deploy/macos_package.py --archive target/dist/corvid-desktop-*-aarch64-apple-darwin.tar.gz --output target/dist
      - name: macOS packaged UI smoke tests
        timeout-minutes: 10
        run: python3 tests/ui/run.py --assets target/dist
      - name: Verify unsigned macOS DMG and open Desktop
        if: *qualify
        env:
          CORVID_DESKTOP_MACOS_SCREENSHOT: target/desktop-macos.png
          CORVID_AGENT_DECK_MACOS_SCREENSHOT: target/agent-deck-macos.png
        run: python3 tests/ui/run.py --assets target/dist --case dmg-windows
      - name: Upgrade the previous macOS installs and verify Dock references
        if: *qualify
        run: |
          dmg=target/corvid-previous.dmg
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/DosangGu/corvid/releases/download/v0.3.3/corvid-desktop-0.3.3-aarch64-apple-darwin.dmg \
            --output "$dmg"
          printf '%s  %s\n' '22b75cb30cbfeff6bba273f95012994f1844e14e5d03b85f6cc954907e76018d' "$dmg" | shasum -a 256 -c
          previous=target/corvid-desktop-0.3.3-aarch64-apple-darwin.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/DosangGu/corvid/releases/download/v0.3.3/corvid-desktop-0.3.3-aarch64-apple-darwin.tar.gz \
            --output "$previous"
          printf '%s  %s\n' '8c7af98454eb28b6b4b9cf601333a92186a050c0cda42914365a64a7165632cb' "$previous" | shasum -a 256 -c
          python3 deploy/test_macos_dock_update.py --previous-dmg "$dmg" --previous-archive "$previous" \
            --archive target/dist/corvid-desktop-*-aarch64-apple-darwin.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: *qualify
        with:
          name: agent-deck-macos-preview
          path: target/agent-deck-macos*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: *qualify
        with:
          name: corvid-desktop-macos-preview
          path: target/desktop-macos.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: packaged-ui-failure-${{ matrix.target }}
          path: target/ui-tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-${{ matrix.target }}
          path: target/dist/
          if-no-files-found: error

  assemble:
    needs: [linux-installers, windows-installers, macos-installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: tui-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - run: python3 deploy/package.py manifest --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
