name: Package Corvid

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    # Verify installers early when their inputs or update paths change.
    paths:
      - '.cargo/**'
      - '.gitattributes'
      - '.github/workflows/package.yml'
      - '.github/workflows/release.yml'
      - 'Cargo.lock'
      - 'LICENSE'
      - 'assets/**'
      - 'crates/corvid-client/src/endpoint/bootstrap*'
      - 'crates/corvid-client/src/endpoint/install_windows.ps1'
      - 'crates/corvid-client/src/upgrade.rs'
      - 'crates/corvid-daemon/src/upgrade.rs'
      - 'crates/corvid-desktop/src/workspace_view/update.rs'
      - 'crates/corvid-desktop/src/workspace_view/update/state.rs'
      - 'crates/corvid-protocol/src/upgrade.rs'
      - 'crates/corvid-tui/src/update.rs'
      - 'crates/corvid-update/**'
      - 'deploy/cargo-desktop'
      - 'deploy/install.ps1'
      - 'deploy/install.sh'
      - 'deploy/linux/**'
      - 'deploy/macos/**'
      - 'deploy/systemd/**'
      - 'deploy/windows/**'
      - 'deploy/*package*.py'
      - 'deploy/release.py'
      - 'deploy/release-notes.md'
      - 'deploy/test_icons.py'
      - 'deploy/test_install.py'
      - 'deploy/test_macos.py'
      - 'deploy/test_native.py'
  push:
    branches: [main]
    # Keep these paths in sync with the push fallback in deploy/validate_changes.py.
    paths:
      - '.cargo/**'
      - '.gitattributes'
      - '.gitignore'
      - '.github/workflows/build-and-test.yml'
      - '.github/workflows/package.yml'
      - '.github/workflows/release.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'LICENSE'
      - 'assets/**'
      - 'crates/**'
      - 'deploy/**'
      - 'plugins/**'
      - 'rust-toolchain.toml'
      - 'spikes/**'

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 deploy/release.py validate
      - run: python3 deploy/test_icons.py
      - run: cargo fmt --all -- --check

  pipeline:
    needs: validate
    uses: ./.github/workflows/build-and-test.yml
    with:
      package: true
