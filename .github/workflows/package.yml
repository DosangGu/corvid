name: Package Corvid

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    # Verify installers early when their inputs or update paths change.
    paths:
      - '.cargo/**'
      - '.gitattributes'
      - '.github/workflows/linux.yml'
      - '.github/workflows/macos.yml'
      - '.github/workflows/package.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/windows.yml'
      - 'Cargo.lock'
      - 'LICENSE'
      - 'assets/**'
      - 'crates/corvid-client/src/endpoint/bootstrap*'
      - 'crates/corvid-client/src/endpoint/install_windows.ps1'
      - 'crates/corvid-client/src/upgrade.rs'
      - 'crates/corvid-daemon/src/upgrade.rs'
      - 'crates/corvid-desktop/src/workspace_view/update.rs'
      - 'crates/corvid-desktop/src/workspace_view/update/state.rs'
      - 'crates/corvid-protocol/src/upgrade.rs'
      - 'crates/corvid-tui/src/update.rs'
      - 'crates/corvid-update/**'
      - 'deploy/cargo-desktop'
      - 'deploy/install.ps1'
      - 'deploy/install.sh'
      - 'deploy/linux/**'
      - 'deploy/macos/**'
      - 'deploy/systemd/**'
      - 'deploy/windows/**'
      - 'deploy/*package*.py'
      - 'deploy/release.py'
      - 'deploy/release-notes.md'
      - 'deploy/test_icons.py'
      - 'deploy/test_install.py'
      - 'deploy/test_macos.py'
      - 'deploy/test_native.py'
  push:
    branches: [main]
    # Keep these paths in sync with the push fallback in deploy/validate_changes.py.
    paths:
      - '.cargo/**'
      - '.gitattributes'
      - '.gitignore'
      - '.github/workflows/linux.yml'
      - '.github/workflows/macos.yml'
      - '.github/workflows/package.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/windows.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'LICENSE'
      - 'assets/**'
      - 'crates/**'
      - 'deploy/**'
      - 'plugins/**'
      - 'rust-toolchain.toml'
      - 'spikes/**'

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  MACOSX_DEPLOYMENT_TARGET: '15.0'
  PYTHONUNBUFFERED: '1'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 deploy/release.py validate
      - run: python3 deploy/test_icons.py
      - run: cargo fmt --all -- --check

  linux:
    needs: validate
    uses: ./.github/workflows/linux.yml
    with:
      package: true

  windows:
    needs: validate
    uses: ./.github/workflows/windows.yml
    with:
      package: true

  macos:
    needs: validate
    uses: ./.github/workflows/macos.yml
    with:
      package: true

  linux-installers:
    needs: [linux, windows, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            native: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            native: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux Desktop integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1 libxkbcommon0 libxkbcommon-x11-0 libudev1 libfontconfig1 libssl3t64 libvulkan1 mesa-vulkan-drivers xvfb xauth x11-utils xdotool xclip desktop-file-utils openbox
          mkdir -p "$HOME/.corvid-tests"
          chmod 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: target/runtimes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: binaries-desktop-${{ matrix.target }}
          path: target/desktop-binaries
      - name: Package Desktop with all runtimes
        run: python deploy/package.py package --product desktop --target ${{ matrix.target }} --runtime target/runtimes/runtime-${{ matrix.native }} --linux-runtime target/runtimes/runtime-x86_64-unknown-linux-musl --windows-runtime target/runtimes/runtime-x86_64-pc-windows-msvc --linux-arm64-runtime target/runtimes/runtime-aarch64-unknown-linux-musl --windows-arm64-runtime target/runtimes/runtime-aarch64-pc-windows-msvc --macos-runtime target/runtimes/runtime-aarch64-apple-darwin --build target/desktop-binaries --output target/dist
      - name: Install Rust target for installer fixtures
        run: rustup target add ${{ matrix.target }}
      - name: Desktop package installation
        run: python deploy/test_install.py --assets target/dist --binary target/runtimes/runtime-${{ matrix.native }}/corvid --product desktop
      - name: Linux Desktop display smoke test
        run: xvfb-run -a python3 deploy/test_desktop.py target/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-${{ matrix.target }}
          path: target/dist/
          if-no-files-found: error

  windows-installers:
    needs: [linux, windows, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            native: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            native: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: target/runtimes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: binaries-desktop-${{ matrix.target }}
          path: target/desktop-binaries
      - name: Verify Windows executable icons
        run: python deploy/test_icons.py --build target/desktop-binaries --runtime target/runtimes/runtime-${{ matrix.native }}/corvid.exe
      - name: Package Desktop with all runtimes
        run: python deploy/package.py package --product desktop --target ${{ matrix.target }} --runtime target/runtimes/runtime-${{ matrix.native }} --linux-runtime target/runtimes/runtime-x86_64-unknown-linux-musl --windows-runtime target/runtimes/runtime-x86_64-pc-windows-msvc --linux-arm64-runtime target/runtimes/runtime-aarch64-unknown-linux-musl --windows-arm64-runtime target/runtimes/runtime-aarch64-pc-windows-msvc --macos-runtime target/runtimes/runtime-aarch64-apple-darwin --build target/desktop-binaries --output target/dist
      - name: Install Rust target for installer fixtures
        run: rustup target add ${{ matrix.target }}
      - name: Desktop package installation
        run: python deploy/test_install.py --assets target/dist --binary target/runtimes/runtime-${{ matrix.native }}/corvid.exe --product desktop
      - name: Build and test Windows Setup
        shell: pwsh
        run: |
          $compiler = ./deploy/windows/Get-InnoCompiler.ps1 -Directory target/inno
          $archive = (Get-ChildItem target/dist -Filter 'corvid-desktop-*.zip').FullName
          python deploy/native_package.py --archive $archive --output target/dist --iscc $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = (Get-ChildItem target/dist -Filter '*-setup.exe').FullName
          python deploy/test_native.py --archive $archive --package $setup --iscc $compiler
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-${{ matrix.target }}
          path: target/dist/
          if-no-files-found: error

  macos-installers:
    needs: [linux, windows, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            native: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: target/runtimes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: binaries-desktop-${{ matrix.target }}
          path: target/desktop-binaries
      - name: Package Desktop with all runtimes
        run: python deploy/package.py package --product desktop --target ${{ matrix.target }} --runtime target/runtimes/runtime-${{ matrix.native }} --linux-runtime target/runtimes/runtime-x86_64-unknown-linux-musl --windows-runtime target/runtimes/runtime-x86_64-pc-windows-msvc --linux-arm64-runtime target/runtimes/runtime-aarch64-unknown-linux-musl --windows-arm64-runtime target/runtimes/runtime-aarch64-pc-windows-msvc --macos-runtime target/runtimes/runtime-aarch64-apple-darwin --build target/desktop-binaries --output target/dist
      - name: Install Rust target for installer fixtures
        run: rustup target add ${{ matrix.target }}
      - name: Desktop package installation
        run: python deploy/test_install.py --assets target/dist --binary target/runtimes/runtime-${{ matrix.native }}/corvid --product desktop
      - name: Build and verify unsigned macOS DMG
        env:
          CORVID_AGENT_DECK_MACOS_SCREENSHOT: target/agent-deck-macos.png
        run: |
          python3 deploy/macos_package.py --archive target/dist/corvid-desktop-*-aarch64-apple-darwin.tar.gz --output target/dist
          python3 deploy/test_macos.py --assets target/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agent-deck-macos-preview
          path: target/agent-deck-macos.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-${{ matrix.target }}
          path: target/dist/
          if-no-files-found: error

  assemble:
    needs: [linux-installers, windows-installers, macos-installers]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: tui-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - run: python3 deploy/package.py manifest --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
