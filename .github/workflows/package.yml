name: Package Corvid

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      full_pipeline: ${{ steps.changes.outputs.full_pipeline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate changed paths and whitespace
        id: changes
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: python3 deploy/validate_changes.py
      - run: python3 deploy/release.py validate
      - run: python3 deploy/test_icons.py
      - run: python3 deploy/test_validate_changes.py
      - run: cargo fmt --all -- --check

  runtime:
    needs: validate
    if: needs.validate.outputs.full_pipeline == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: corvid
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: corvid.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ncurses-bin binutils musl-tools
          mkdir -p "$HOME/.corvid-tests"
          chmod 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      - run: rustup target add ${{ matrix.target }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.target }}/release
          key: rust-${{ runner.os }}-${{ matrix.target }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ matrix.target }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            rust-${{ runner.os }}-${{ matrix.target }}-v1-
      - name: Build runtime and launchers
        run: cargo build --locked --release --target ${{ matrix.target }} -p corvid-tui -p corvid-update
      - name: Runtime tests
        run: cargo test --locked --release --target ${{ matrix.target }} -p corvid-tui -p corvid-daemon -p corvid-client -p corvid-update
      - name: Runtime manifest
        run: python deploy/package.py runtime --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.binary }} --output target/runtime
      - name: Package TUI
        run: python deploy/package.py package --product tui --target ${{ matrix.target }} --runtime target/runtime --build target/${{ matrix.target }}/release --output target/dist
      - name: Validate installation and daemon lifecycle
        run: python deploy/test_install.py --assets target/dist --binary target/${{ matrix.target }}/release/${{ matrix.binary }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.target }}
          path: target/runtime/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tui-${{ matrix.target }}
          path: target/dist/
          if-no-files-found: error

  desktop:
    needs: runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            native: x86_64-unknown-linux-musl
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            native: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux Desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ncurses-bin libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libudev-dev libfontconfig1-dev libssl-dev libvulkan1 mesa-vulkan-drivers xvfb xauth x11-utils xdotool desktop-file-utils openbox
          mkdir -p "$HOME/.corvid-tests"
          chmod 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: target/runtimes
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.target }}/release
          key: desktop-${{ runner.os }}-${{ matrix.target }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            desktop-${{ runner.os }}-${{ matrix.target }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            desktop-${{ runner.os }}-${{ matrix.target }}-v1-
      - name: Build Desktop and plugins
        run: cargo build --locked --release --target ${{ matrix.target }} -p corvid-desktop -p corvid-deck -p corvid-agent-deck -p corvid-update
      - name: Verify Windows executable icons
        if: runner.os == 'Windows'
        run: python deploy/test_icons.py --build target/${{ matrix.target }}/release --runtime target/runtimes/runtime-x86_64-pc-windows-msvc/corvid.exe
      - name: Workspace tests
        run: cargo test --locked --release --target ${{ matrix.target }} --workspace
      - name: Workspace lints
        run: cargo clippy --locked --release --target ${{ matrix.target }} --workspace --all-targets -- -D warnings
      - name: Package Desktop with both runtimes
        run: python deploy/package.py package --product desktop --target ${{ matrix.target }} --runtime target/runtimes/runtime-${{ matrix.native }} --linux-runtime target/runtimes/runtime-x86_64-unknown-linux-musl --windows-runtime target/runtimes/runtime-x86_64-pc-windows-msvc --build target/${{ matrix.target }}/release --output target/dist
      - name: Desktop package installation
        run: python deploy/test_install.py --assets target/dist --binary target/runtimes/runtime-${{ matrix.native }}/${{ runner.os == 'Windows' && 'corvid.exe' || 'corvid' }} --product desktop
      - name: Linux Desktop display smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 deploy/test_desktop.py target/dist
      - name: Build and test Windows Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = ./deploy/windows/Get-InnoCompiler.ps1 -Directory target/inno
          $archive = (Get-ChildItem target/dist -Filter 'corvid-desktop-*.zip').FullName
          python deploy/native_package.py --archive $archive --output target/dist --iscc $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = (Get-ChildItem target/dist -Filter '*-setup.exe').FullName
          python deploy/test_native.py --archive $archive --package $setup --iscc $compiler
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-${{ matrix.target }}
          path: target/dist/
          if-no-files-found: error

  assemble:
    needs: [runtime, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: tui-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - run: python3 deploy/package.py manifest --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  package-checks:
    name: Package checks
    needs: [validate, runtime, desktop, assemble]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check validation and packaging results
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          FULL_PIPELINE: ${{ needs.validate.outputs.full_pipeline }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          ASSEMBLE_RESULT: ${{ needs.assemble.result }}
        run: |
          if [[ "$VALIDATE_RESULT" != success ]]; then
            echo "::error::Validation finished with $VALIDATE_RESULT"
            exit 1
          fi
          case "$FULL_PIPELINE" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) echo "::error::Missing change classification"; exit 1 ;;
          esac
          if [[ "$RUNTIME_RESULT" != "$expected" || "$DESKTOP_RESULT" != "$expected" || "$ASSEMBLE_RESULT" != "$expected" ]]; then
            echo "::error::Expected $expected for packaging jobs, got runtime=$RUNTIME_RESULT desktop=$DESKTOP_RESULT assemble=$ASSEMBLE_RESULT"
            exit 1
          fi

  publish:
    needs: assemble
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-assets
          path: dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/release.py publish --assets dist
