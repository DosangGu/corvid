name: Package Corvid

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux-daemon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build the static Linux daemon
        run: |
          sudo apt-get update
          sudo apt-get install -y ncurses-bin binutils
          cargo --version
          rustup target add x86_64-unknown-linux-musl
          bash deploy/linux/package-corvid.sh
      - name: Smoke test the packaged daemon
        run: |
          binary=target/linux-dist/x86_64-unknown-linux-musl/corvid
          scratch=$(mktemp -d "$HOME/.corvid-package-test.XXXXXXXX")
          "$binary" --runtime-dir "$scratch/run" daemon --state-dir "$scratch/state" &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true; wait "$daemon_pid" || true; rm -rf -- "$scratch"' EXIT
          for attempt in {1..40}; do
            if "$binary" --runtime-dir "$scratch/run" control ping 2>/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          "$binary" --runtime-dir "$scratch/run" control ping
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corvid-linux-x64-daemon
          path: target/linux-dist/x86_64-unknown-linux-musl/
          if-no-files-found: error

  windows-desktop:
    needs: linux-daemon
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corvid-linux-x64-daemon
          path: target/linux-daemon
      - name: Bundle the Windows apps and daemon payloads
        shell: powershell
        run: ./desktop/packaging/windows/Package-Corvid.ps1 -LinuxDaemonDirectory target/linux-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corvid-windows-x64-with-daemon
          path: target/windows-dist/corvid-windows-x64-with-daemon.zip
          if-no-files-found: error
