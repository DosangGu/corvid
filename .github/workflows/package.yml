name: Package Corvid

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    # Keep these paths in sync with the push fallback in deploy/validate_changes.py.
    paths:
      - '.cargo/**'
      - '.gitattributes'
      - '.gitignore'
      - '.github/workflows/build-and-test.yml'
      - '.github/workflows/package.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'LICENSE'
      - 'assets/**'
      - 'crates/**'
      - 'deploy/**'
      - 'plugins/**'
      - 'rust-toolchain.toml'
      - 'spikes/**'

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 deploy/release.py validate
      - run: python3 deploy/test_icons.py
      - run: cargo fmt --all -- --check

  pipeline:
    needs: validate
    if: ${{
      !cancelled() &&
      (needs.validate.result == 'success' ||
       (github.ref == 'refs/heads/main' && needs.validate.result == 'skipped'))
      }}
    uses: ./.github/workflows/build-and-test.yml
    with:
      package: true

  publish:
    needs: pipeline
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-assets
          path: dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/release.py publish --assets dist
