name: Checks / UI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checks-ui.yml'
      - '.github/actions/apt-install/**'
      - '.github/workflows/package.yml'
      - 'tests/ui/**'
      - 'plugins/agent-deck/tests/ui/**'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to test
        type: choice
        options: [all, linux, windows, macos]
        default: all
      case:
        description: Case name, or leave empty for the smoke suite
        type: string

permissions:
  contents: read

concurrency:
  group: checks-ui-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  PYTHONUNBUFFERED: '1'
  MACOSX_DEPLOYMENT_TARGET: '15.0'

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          PLATFORM: ${{ inputs.platform }}
        shell: bash
        run: |
          matrix='[
            {"runner":"ubuntu-latest","platform":"linux","target":"x86_64-unknown-linux-gnu"},
            {"runner":"ubuntu-26.04-arm","platform":"linux","target":"aarch64-unknown-linux-gnu"},
            {"runner":"windows-latest","platform":"windows","target":"x86_64-pc-windows-msvc"},
            {"runner":"windows-11-arm","platform":"windows","target":"aarch64-pc-windows-msvc"},
            {"runner":"macos-latest","platform":"macos","target":"aarch64-apple-darwin"}
          ]'
          echo "matrix=$(jq -c --arg platform "$PLATFORM" '{include: map(select($platform == "" or $platform == "all" or .platform == $platform))}' <<<"$matrix")" >> "$GITHUB_OUTPUT"
  ui:
    name: UI (${{ matrix.runner }})
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-zig
      - name: Install Linux build and UI dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential ncurses-bin libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libudev-dev libfontconfig1-dev libssl-dev libvulkan1 mesa-vulkan-drivers xvfb xauth x11-utils xdotool xclip openbox openssh-server protobuf-compiler scrot fonts-dejavu-core fonts-noto-color-emoji
      - name: Prepare sshd runtime directory
        if: runner.os == 'Linux'
        run: sudo mkdir -p /run/sshd
      - name: macOS build environment
        if: runner.os == 'macOS'
        run: bash deploy/macos/prepare-build.sh
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: rust-cache
        with:
          path: &rust-cache-paths |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.target }}/release
          key: desktop-${{ matrix.runner }}-${{ matrix.target }}-v2-${{ hashFiles('rust-toolchain.toml', '.cargo/**', '.github/workflows/native.yml', 'deploy/macos/prepare-build.sh') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: desktop-${{ matrix.runner }}-${{ matrix.target }}-v2-
      - name: Build Corvid
        id: build
        run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}
          cargo build --locked --release --target ${{ matrix.target }} -p corvid-tui -p corvid-daemon -p corvid-desktop -p corvid-agent-deck-ui -p corvid-update
      - name: Run UI tests
        timeout-minutes: 10
        shell: bash
        env:
          TEST_CASE: ${{ inputs.case }}
        run: |
          args=(--suite smoke)
          if [[ -n "$TEST_CASE" ]]; then
            args=(--case "$TEST_CASE")
          fi
          python tests/ui/run.py --build target/${{ matrix.target }}/release "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: ui-failure-${{ matrix.target }}
          path: target/ui-tests/
          if-no-files-found: ignore
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        with:
          path: *rust-cache-paths
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
