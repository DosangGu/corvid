name: Checks / Agent Deck

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checks-agent-deck.yml'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'LICENSE'
      - 'crates/corvid-core/**'
      - 'crates/corvid-protocol/**'
      - 'crates/corvid-client/**'
      - 'crates/corvid-companion/**'
      - 'crates/corvid-update/**'
      - 'plugins/agent-deck/**'
      - 'crates/corvid-agent-deck-core/**'
      - 'crates/corvid-presentation/**'

permissions:
  contents: read

concurrency:
  group: checks-agent-deck-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  agent-deck:
    name: Agent Deck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update --error-on=any
          sudo apt-get -o Acquire::Retries=3 install -y build-essential libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libudev-dev libfontconfig1-dev libssl-dev
      - name: Prepare private test directory
        run: |
          mkdir -m 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: checks-agent-deck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**', '.github/workflows/checks-agent-deck.yml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: checks-agent-deck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**', '.github/workflows/checks-agent-deck.yml') }}-
      - run: cargo clippy --locked -p corvid-agent-deck -p corvid-agent-deck-core -p corvid-presentation --all-targets -- -D warnings
      - run: cargo test --locked -p corvid-agent-deck -p corvid-agent-deck-core -p corvid-presentation
