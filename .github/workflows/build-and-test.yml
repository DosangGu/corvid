name: Build and Test Corvid

on:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  MACOSX_DEPLOYMENT_TARGET: '15.0'
  PYTHONUNBUFFERED: '1'

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: corvid
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: corvid
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: corvid.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: corvid.exe
          - os: macos-15
            target: aarch64-apple-darwin
            binary: corvid
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ncurses-bin binutils musl-tools openssh-server protobuf-compiler zsh
          mkdir -p "$HOME/.corvid-tests"
          chmod 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      - name: Linux musl linker
        if: runner.os == 'Linux'
        run: |
          echo "CC=musl-gcc" >> "$GITHUB_ENV"
          target_key=$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${target_key}_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: rustup target add ${{ matrix.target }}
      - name: macOS build environment
        if: runner.os == 'macOS'
        run: bash deploy/macos/prepare-build.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.target }}/release
          key: rust-${{ runner.os }}-${{ matrix.target }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ matrix.target }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            rust-${{ runner.os }}-${{ matrix.target }}-v1-
      - name: Build runtime and launchers
        run: cargo build --locked --release --target ${{ matrix.target }} -p corvid-tui -p corvid-update
      - name: Runtime tests
        run: cargo test --locked --release --target ${{ matrix.target }} -p corvid-tui -p corvid-daemon -p corvid-client -p corvid-update
      - name: Unix PTY qualification
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: |
          cargo build --locked --release --target ${{ matrix.target }} -p corvid-terminal-spike
          python3 spikes/terminal/tests/interactive.py target/${{ matrix.target }}/release/corvid-terminal-spike
      - name: Linux interactive TTY and shell lifecycle
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: python3 crates/corvid-tui/tests/interactive.py target/${{ matrix.target }}/release/corvid
      - name: macOS interactive TTY lifecycle
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: python3 crates/corvid-tui/tests/interactive.py --tty-only target/${{ matrix.target }}/release/corvid
      - name: Retained Unix agent monitoring
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: |
          if [ "${{ runner.os }}" = macOS ] && ! command -v protoc >/dev/null; then
            brew install protobuf
          fi
          python3 crates/corvid-tui/tests/agent_handoff.py target/${{ matrix.target }}/release/corvid
      - name: Prepare isolated Linux SSH lifecycle fixture
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /run/sshd
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Linux SSH disconnect and reconnect
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: python3 crates/corvid-tui/tests/ssh_lifecycle.py target/${{ matrix.target }}/release/corvid
      - name: Runtime manifest
        if: inputs.package
        run: python deploy/package.py runtime --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.binary }} --output target/runtime
      - name: Package TUI
        if: inputs.package
        run: python deploy/package.py package --product tui --target ${{ matrix.target }} --runtime target/runtime --build target/${{ matrix.target }}/release --output target/dist
      - name: Validate installation and daemon lifecycle
        if: inputs.package
        run: python deploy/test_install.py --assets target/dist --binary target/${{ matrix.target }}/release/${{ matrix.binary }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.package
        with:
          name: runtime-${{ matrix.target }}
          path: target/runtime/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.package
        with:
          name: tui-${{ matrix.target }}
          path: target/dist/
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux Desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ncurses-bin libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libudev-dev libfontconfig1-dev libssl-dev libvulkan1 mesa-vulkan-drivers xvfb xauth x11-utils xdotool xclip openbox openssh-server protobuf-compiler scrot
          sudo mkdir -p /run/sshd
          mkdir -p "$HOME/.corvid-tests"
          chmod 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      - name: macOS build environment
        if: runner.os == 'macOS'
        run: bash deploy/macos/prepare-build.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.target }}/release
          key: desktop-${{ runner.os }}-${{ matrix.target }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            desktop-${{ runner.os }}-${{ matrix.target }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            desktop-${{ runner.os }}-${{ matrix.target }}-v1-
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: rustup target add ${{ matrix.target }}
      - name: Build Desktop and plugins
        run: cargo build --locked --release --target ${{ matrix.target }} -p corvid-tui -p corvid-desktop -p corvid-deck -p corvid-agent-deck -p corvid-update ${{ runner.os == 'macOS' && '--features corvid-deck/stream-deck' || '' }}
      - name: Workspace tests
        run: cargo test --locked --release --target ${{ matrix.target }} --workspace ${{ runner.os == 'macOS' && '--features corvid-deck/stream-deck' || '' }}
      - name: Workspace lints
        run: cargo clippy --locked --release --target ${{ matrix.target }} --workspace --all-targets ${{ runner.os == 'macOS' && '--features corvid-deck/stream-deck' || '' }} -- -D warnings
      - name: Linux Desktop title synchronization over SSH
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: python3 deploy/test_title_ssh.py --binary target/${{ matrix.target }}/release/corvid --target ${{ matrix.target }} --release
      - name: Linux Desktop UI interactions
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          CORVID_AGENT_DECK_SCREENSHOT: target/agent-deck-ready.png
          CORVID_AGENT_DECK_SETTINGS_SCREENSHOT: target/agent-deck-settings.png
          CORVID_WORKSPACE_SCREENSHOT: target/workspace-directory.png
          CORVID_CLOSE_SCREENSHOT: target/desktop-close-confirmation.png
          CORVID_PANE_CLOSE_PREVIEW_DIR: target
          CORVID_SCROLL_PREVIEW_DIR: target
        run: xvfb-run -a python3 deploy/test_desktop.py --build target/${{ matrix.target }}/release
      - name: Connected managed SSH updates
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: xvfb-run -a python3 deploy/test_remote_update.py --build target/${{ matrix.target }}/release --target ${{ matrix.target }} --screenshot target/remote-update-prompt.png
      - name: Linux Agent Deck card focus
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run -a python3 deploy/test_deck_focus.py --build target/${{ matrix.target }}/release --history-screenshot target/agent-deck-run-history.png
      - name: Linux Agent Deck multi-host grid
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          CORVID_MULTI_HOST_GRID_SCREENSHOT: ${{ github.workspace }}/target/agent-deck-multi-host.png
        run: |
          runtime=$(mktemp -d "$HOME/.cv-grid-XXXXXX")
          trap 'rm -rf -- "$runtime"' EXIT
          XDG_RUNTIME_DIR="$runtime" xvfb-run -a cargo test --locked --release --target ${{ matrix.target }} -p corvid-agent-deck --bin corvid-agent-deck grid_routes_clicks_to_local_and_two_ssh_scopes -- --ignored --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: remote-update-preview-${{ matrix.target }}
          path: target/remote-update-prompt.png
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: agent-deck-preview-${{ matrix.target }}
          path: |
            target/agent-deck-ready.png
            target/agent-deck-settings.png
            target/agent-deck-run-history.png
            target/agent-deck-multi-host.png
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: workspace-directory-preview-${{ matrix.target }}
          path: |
            target/workspace-directory.png
            target/desktop-close-confirmation.png
            target/pane-close-before.png
            target/pane-close-after.png
            target/agent-history.png
            target/scroll-history.png
            target/scroll-live.png
            target/tab-search.png
          if-no-files-found: error
      - name: Stage binaries for Desktop integration
        if: inputs.package
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $binaries = @("corvid-desktop$suffix", "corvid-agent-deck$suffix")
          if ($IsWindows) {
            $binaries += @('corvid-launch.exe', 'corvid-desktop-launch.exe', 'corvid-agent-deck-launch.exe', 'corvid-deck.exe')
          }
          if ($IsMacOS) { $binaries += @('corvid-deck', 'corvid-streamdeck') }
          New-Item -ItemType Directory -Path target/desktop-binaries | Out-Null
          foreach ($binary in $binaries) {
            Copy-Item -LiteralPath "target/${{ matrix.target }}/release/$binary" -Destination target/desktop-binaries
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.package
        with:
          name: binaries-desktop-${{ matrix.target }}
          path: target/desktop-binaries/
          if-no-files-found: error

  desktop-package:
    needs: [runtime, desktop]
    if: inputs.package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            native: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            native: aarch64-unknown-linux-musl
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            native: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            native: aarch64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
            native: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux Desktop integration dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1 libxkbcommon0 libxkbcommon-x11-0 libudev1 libfontconfig1 libssl3t64 libvulkan1 mesa-vulkan-drivers xvfb xauth x11-utils xdotool xclip desktop-file-utils openbox
          mkdir -p "$HOME/.corvid-tests"
          chmod 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      # TODO: Update download-artifact once ZIP extraction stops emitting DEP0005
      # Track https://github.com/actions/toolkit/issues/2003 and update the workflow pins when a fixed download-artifact release is available.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: target/runtimes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: binaries-desktop-${{ matrix.target }}
          path: target/desktop-binaries
      - name: Verify Windows executable icons
        if: runner.os == 'Windows'
        run: python deploy/test_icons.py --build target/desktop-binaries --runtime target/runtimes/runtime-${{ matrix.native }}/corvid.exe
      - name: Package Desktop with all runtimes
        run: python deploy/package.py package --product desktop --target ${{ matrix.target }} --runtime target/runtimes/runtime-${{ matrix.native }} --linux-runtime target/runtimes/runtime-x86_64-unknown-linux-musl --windows-runtime target/runtimes/runtime-x86_64-pc-windows-msvc --linux-arm64-runtime target/runtimes/runtime-aarch64-unknown-linux-musl --windows-arm64-runtime target/runtimes/runtime-aarch64-pc-windows-msvc --macos-runtime target/runtimes/runtime-aarch64-apple-darwin --build target/desktop-binaries --output target/dist
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Install Rust target for installer fixtures
        run: rustup target add ${{ matrix.target }}
      - name: Desktop package installation
        run: python deploy/test_install.py --assets target/dist --binary target/runtimes/runtime-${{ matrix.native }}/${{ runner.os == 'Windows' && 'corvid.exe' || 'corvid' }} --product desktop
      - name: Build and verify unsigned macOS DMG
        if: runner.os == 'macOS'
        env:
          CORVID_AGENT_DECK_MACOS_SCREENSHOT: target/agent-deck-macos.png
        run: |
          python3 deploy/macos_package.py --archive target/dist/corvid-desktop-*-aarch64-apple-darwin.tar.gz --output target/dist
          python3 deploy/test_macos.py --assets target/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'macOS'
        with:
          name: agent-deck-macos-preview
          path: target/agent-deck-macos.png
          if-no-files-found: ignore
      - name: Linux Desktop display smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 deploy/test_desktop.py target/dist
      - name: Build and test Windows Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = ./deploy/windows/Get-InnoCompiler.ps1 -Directory target/inno
          $archive = (Get-ChildItem target/dist -Filter 'corvid-desktop-*.zip').FullName
          python deploy/native_package.py --archive $archive --output target/dist --iscc $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = (Get-ChildItem target/dist -Filter '*-setup.exe').FullName
          python deploy/test_native.py --archive $archive --package $setup --iscc $compiler
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-${{ matrix.target }}
          path: target/dist/
          if-no-files-found: error

  assemble:
    needs: [runtime, desktop-package]
    if: inputs.package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: tui-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - run: python3 deploy/package.py manifest --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
