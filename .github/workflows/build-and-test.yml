name: Build and Test Corvid

on:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: corvid
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: corvid.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ncurses-bin binutils musl-tools
          mkdir -p "$HOME/.corvid-tests"
          chmod 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      - run: rustup target add ${{ matrix.target }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.target }}/release
          key: rust-${{ runner.os }}-${{ matrix.target }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ matrix.target }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            rust-${{ runner.os }}-${{ matrix.target }}-v1-
      - name: Build runtime and launchers
        run: cargo build --locked --release --target ${{ matrix.target }} -p corvid-tui -p corvid-update
      - name: Runtime tests
        run: cargo test --locked --release --target ${{ matrix.target }} -p corvid-tui -p corvid-daemon -p corvid-client -p corvid-update
      - name: Runtime manifest
        if: inputs.package
        run: python deploy/package.py runtime --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.binary }} --output target/runtime
      - name: Package TUI
        if: inputs.package
        run: python deploy/package.py package --product tui --target ${{ matrix.target }} --runtime target/runtime --build target/${{ matrix.target }}/release --output target/dist
      - name: Validate installation and daemon lifecycle
        if: inputs.package
        run: python deploy/test_install.py --assets target/dist --binary target/${{ matrix.target }}/release/${{ matrix.binary }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.package
        with:
          name: runtime-${{ matrix.target }}
          path: target/runtime/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.package
        with:
          name: tui-${{ matrix.target }}
          path: target/dist/
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux Desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ncurses-bin libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libudev-dev libfontconfig1-dev libssl-dev
          mkdir -p "$HOME/.corvid-tests"
          chmod 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.target }}/release
          key: desktop-${{ runner.os }}-${{ matrix.target }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            desktop-${{ runner.os }}-${{ matrix.target }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            desktop-${{ runner.os }}-${{ matrix.target }}-v1-
      - name: Build Desktop and plugins
        run: cargo build --locked --release --target ${{ matrix.target }} -p corvid-desktop -p corvid-deck -p corvid-agent-deck -p corvid-update
      - name: Workspace tests
        run: cargo test --locked --release --target ${{ matrix.target }} --workspace
      - name: Workspace lints
        run: cargo clippy --locked --release --target ${{ matrix.target }} --workspace --all-targets -- -D warnings
      - name: Stage binaries for Desktop integration
        if: inputs.package
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $binaries = @("corvid-desktop$suffix", "corvid-agent-deck$suffix")
          if ($IsWindows) {
            $binaries += @('corvid-launch.exe', 'corvid-desktop-launch.exe', 'corvid-agent-deck-launch.exe', 'corvid-deck.exe')
          }
          New-Item -ItemType Directory -Path target/desktop-binaries | Out-Null
          foreach ($binary in $binaries) {
            Copy-Item -LiteralPath "target/${{ matrix.target }}/release/$binary" -Destination target/desktop-binaries
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.package
        with:
          name: binaries-desktop-${{ matrix.target }}
          path: target/desktop-binaries/
          if-no-files-found: error

  desktop-package:
    needs: [runtime, desktop]
    if: inputs.package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            native: x86_64-unknown-linux-musl
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            native: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux Desktop integration dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1 libxkbcommon0 libxkbcommon-x11-0 libudev1 libfontconfig1 libssl3t64 libvulkan1 mesa-vulkan-drivers xvfb xauth x11-utils xdotool desktop-file-utils openbox
          mkdir -p "$HOME/.corvid-tests"
          chmod 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: target/runtimes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: binaries-desktop-${{ matrix.target }}
          path: target/desktop-binaries
      - name: Verify Windows executable icons
        if: runner.os == 'Windows'
        run: python deploy/test_icons.py --build target/desktop-binaries --runtime target/runtimes/runtime-x86_64-pc-windows-msvc/corvid.exe
      - name: Package Desktop with both runtimes
        run: python deploy/package.py package --product desktop --target ${{ matrix.target }} --runtime target/runtimes/runtime-${{ matrix.native }} --linux-runtime target/runtimes/runtime-x86_64-unknown-linux-musl --windows-runtime target/runtimes/runtime-x86_64-pc-windows-msvc --build target/desktop-binaries --output target/dist
      - name: Desktop package installation
        run: python deploy/test_install.py --assets target/dist --binary target/runtimes/runtime-${{ matrix.native }}/${{ runner.os == 'Windows' && 'corvid.exe' || 'corvid' }} --product desktop
      - name: Linux Desktop display smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 deploy/test_desktop.py target/dist
      - name: Build and test Windows Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = ./deploy/windows/Get-InnoCompiler.ps1 -Directory target/inno
          $archive = (Get-ChildItem target/dist -Filter 'corvid-desktop-*.zip').FullName
          python deploy/native_package.py --archive $archive --output target/dist --iscc $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = (Get-ChildItem target/dist -Filter '*-setup.exe').FullName
          python deploy/test_native.py --archive $archive --package $setup --iscc $compiler
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-${{ matrix.target }}
          path: target/dist/
          if-no-files-found: error

  assemble:
    needs: [runtime, desktop-package]
    if: inputs.package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: tui-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - run: python3 deploy/package.py manifest --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
