name: Checks / TUI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/linux-routing-backtrace.sh'
      - '.github/workflows/checks-tui.yml'
      - '.github/actions/install-zig/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'LICENSE'
      - 'crates/corvid-async/**'
      - 'crates/corvid-core/**'
      - 'crates/corvid-protocol/**'
      - 'crates/corvid-daemon/**'
      - 'crates/corvid-update/**'
      - 'crates/corvid-client/**'
      - 'crates/corvid-companion/**'
      - 'crates/corvid-agent-deck/**'
      - 'crates/corvid-tui/**'
      - 'spikes/terminal/**'

permissions:
  contents: read

concurrency:
  group: checks-tui-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  tui:
    name: TUI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-zig
      - name: Install Linux build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update --error-on=any
          sudo apt-get -o Acquire::Retries=3 install -y ncurses-bin gdb
      - name: Prepare private test directory
        run: |
          mkdir -m 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: checks-tui-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**', '.github/workflows/checks-tui.yml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: checks-tui-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**', '.github/workflows/checks-tui.yml') }}-
      - run: cargo clippy --locked -p corvid-tui -p corvid-client -p corvid-companion --all-targets -- -D warnings
      - run: cargo test --locked -p corvid-client -p corvid-companion
      - run: cargo test --locked -p corvid-tui --lib --bins
      - name: Verify client dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked -p corvid-tui -p corvid-desktop --edges normal,build --prefix none > "$RUNNER_TEMP/corvid-client-graph"
          if grep -E '^(corvid-daemon|ghostty-vt(-sys)?|vt100) ' "$RUNNER_TEMP/corvid-client-graph"; then
            echo "A client links the daemon" >&2
            exit 1
          fi
      - name: Build the standalone daemon, CLI, and terminal spike
        run: cargo build --locked -p corvid-daemon --bin corvidd -p corvid-tui --bin corvid -p corvid-terminal-spike
      - name: TUI integration tests for IPC, PTY routing, and reconnect
        env:
          CORVID_TEST_ROUTING_DIAGNOSTICS: '1'
          RUST_BACKTRACE: '1'
        shell: bash
        run: >
          bash .github/scripts/linux-routing-backtrace.sh
          cargo test --locked -p corvid-tui
          --test control --test monitor --test routing --test scripted_attach
          --test workspace_directory -- --test-threads=4
      - name: Unix PTY qualification
        timeout-minutes: 10
        run: |
          python3 spikes/terminal/tests/interactive.py target/debug/corvid-terminal-spike
          python3 crates/corvid-tui/tests/interactive.py --tty-only target/debug/corvid
