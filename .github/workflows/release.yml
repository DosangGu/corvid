name: Publish Corvid Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    uses: ./.github/workflows/package.yml

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-assets
          path: dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/release.py publish --assets dist

  crates-io:
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/crates-io.yml
    with:
      trusted_publishing: ${{ vars.PUBLISH_CRATES_IO == 'true' }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
