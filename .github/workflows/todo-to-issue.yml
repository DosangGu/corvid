name: TODO to Issue

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  todo-to-issue:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync TODO comments with issues
        uses: alstr/todo-to-issue-action@37bb7b56e58569ef273b60678048030a7f0c261a # v5.1.15
        with:
          CLOSE_ISSUES: 'true'
          INSERT_ISSUE_URLS: 'false'
          # Documentation examples should not create issues.
          IGNORE: '.*\.md$'
