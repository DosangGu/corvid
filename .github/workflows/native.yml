name: Corvid Native Checks

on:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  PYTHONUNBUFFERED: '1'

jobs:
  linux-runtime:
    name: Linux Runtime (${{ matrix.runner }})
    strategy: &linux-targets
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            runtime: x86_64-unknown-linux-musl
            desktop: x86_64-unknown-linux-gnu
          - runner: ubuntu-26.04-arm
            runtime: aarch64-unknown-linux-musl
            desktop: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux build tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update --error-on=any
          sudo apt-get -o Acquire::Retries=3 install -y ncurses-bin binutils musl-tools openssh-server protobuf-compiler zsh
          mkdir -p "$HOME/.corvid-tests"
          chmod 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      - name: Linux musl linker
        run: |
          echo "CC=musl-gcc" >> "$GITHUB_ENV"
          target_key=$(echo '${{ matrix.runtime }}' | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${target_key}_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: rustup target add ${{ matrix.runtime }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &runtime-cache
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.runtime }}/release
          key: rust-${{ matrix.runner }}-${{ matrix.runtime }}-v2-${{ hashFiles('rust-toolchain.toml', '.cargo/**', '.github/workflows/native.yml', 'deploy/macos/prepare-build.sh') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ matrix.runner }}-${{ matrix.runtime }}-v2-${{ hashFiles('rust-toolchain.toml', '.cargo/**', '.github/workflows/native.yml', 'deploy/macos/prepare-build.sh') }}-
      - name: Build runtime and launchers
        run: cargo build --locked --release --target ${{ matrix.runtime }} -p corvid-tui -p corvid-update
      - name: Runtime tests
        run: cargo test --locked --release --target ${{ matrix.runtime }} -p corvid-tui -p corvid-daemon -p corvid-client -p corvid-update
      - name: Unix PTY qualification
        timeout-minutes: 10
        run: |
          cargo build --locked --release --target ${{ matrix.runtime }} -p corvid-terminal-spike
          python3 spikes/terminal/tests/interactive.py target/${{ matrix.runtime }}/release/corvid-terminal-spike
      - name: Linux interactive TTY and shell lifecycle
        timeout-minutes: 10
        run: python3 crates/corvid-tui/tests/interactive.py target/${{ matrix.runtime }}/release/corvid
      - name: Retained Unix agent monitoring
        timeout-minutes: 10
        run: |
          python3 crates/corvid-tui/tests/agent_handoff.py target/${{ matrix.runtime }}/release/corvid
      - name: Prepare isolated Linux SSH lifecycle fixture
        run: |
          sudo mkdir -p /run/sshd
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Linux SSH disconnect and reconnect
        timeout-minutes: 10
        run: python3 crates/corvid-tui/tests/ssh_lifecycle.py target/${{ matrix.runtime }}/release/corvid
      - name: Runtime manifest
        if: inputs.package
        run: python deploy/package.py runtime --target ${{ matrix.runtime }} --binary target/${{ matrix.runtime }}/release/corvid --output target/runtime
      - name: Package TUI
        if: inputs.package
        run: python deploy/package.py package --product tui --target ${{ matrix.runtime }} --runtime target/runtime --build target/${{ matrix.runtime }}/release --output target/dist
      - name: Validate installation and daemon lifecycle
        if: inputs.package
        run: python deploy/test_install.py --assets target/dist --binary target/${{ matrix.runtime }}/release/corvid
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.package
        with:
          name: runtime-${{ matrix.runtime }}
          path: target/runtime/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.package
        with:
          name: tui-${{ matrix.runtime }}
          path: target/dist/
          if-no-files-found: error

  linux-desktop:
    name: Linux Desktop (${{ matrix.runner }})
    strategy: *linux-targets
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux Desktop dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update --error-on=any
          sudo apt-get -o Acquire::Retries=3 install -y build-essential ncurses-bin libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libudev-dev libfontconfig1-dev libssl-dev libvulkan1 mesa-vulkan-drivers xvfb xauth x11-utils xdotool xclip openbox openssh-server protobuf-compiler scrot
          sudo mkdir -p /run/sshd
          mkdir -p "$HOME/.corvid-tests"
          chmod 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &desktop-cache
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.desktop }}/release
          key: desktop-${{ matrix.runner }}-${{ matrix.desktop }}-v2-${{ hashFiles('rust-toolchain.toml', '.cargo/**', '.github/workflows/native.yml', 'deploy/macos/prepare-build.sh') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: desktop-${{ matrix.runner }}-${{ matrix.desktop }}-v2-${{ hashFiles('rust-toolchain.toml', '.cargo/**', '.github/workflows/native.yml', 'deploy/macos/prepare-build.sh') }}-
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: rustup target add ${{ matrix.desktop }}
      - name: Build Desktop and plugins
        run: cargo build --locked --release --target ${{ matrix.desktop }} -p corvid-tui -p corvid-desktop -p corvid-deck -p corvid-agent-deck -p corvid-update
      - name: Workspace tests
        run: cargo test --locked --release --target ${{ matrix.desktop }} --workspace
      - name: Workspace lints
        run: cargo clippy --locked --release --target ${{ matrix.desktop }} --workspace --all-targets -- -D warnings
      - name: Linux Desktop title synchronization over SSH
        timeout-minutes: 10
        run: python3 deploy/test_title_ssh.py --binary target/${{ matrix.desktop }}/release/corvid --target ${{ matrix.desktop }} --release
      - name: Linux Desktop UI interactions
        timeout-minutes: 10
        env:
          CORVID_AGENT_DECK_SCREENSHOT: target/agent-deck-ready.png
          CORVID_AGENT_DECK_SETTINGS_SCREENSHOT: target/agent-deck-settings.png
          CORVID_WORKSPACE_SCREENSHOT: target/workspace-directory.png
          CORVID_CLOSE_SCREENSHOT: target/desktop-close-confirmation.png
          CORVID_PANE_CLOSE_PREVIEW_DIR: target
          CORVID_SCROLL_PREVIEW_DIR: target
        run: xvfb-run -a python3 deploy/test_desktop.py --build target/${{ matrix.desktop }}/release
      - name: Connected managed SSH updates
        timeout-minutes: 10
        run: xvfb-run -a python3 deploy/test_remote_update.py --build target/${{ matrix.desktop }}/release --target ${{ matrix.desktop }} --screenshot target/remote-update-prompt.png
      - name: Linux Agent Deck card focus
        timeout-minutes: 5
        run: |
          xvfb-run -a python3 deploy/test_deck_focus.py --build target/${{ matrix.desktop }}/release \
            --history-screenshot target/agent-deck-run-history.png --tooltip-screenshot target/agent-deck-tooltip.png
      - name: Linux Agent Deck multi-host grid
        timeout-minutes: 5
        env:
          CORVID_MULTI_HOST_GRID_SCREENSHOT: ${{ github.workspace }}/target/agent-deck-multi-host.png
        run: |
          runtime=$(mktemp -d "$HOME/.cv-grid-XXXXXX")
          trap 'rm -rf -- "$runtime"' EXIT
          XDG_RUNTIME_DIR="$runtime" xvfb-run -a cargo test --locked --release --target ${{ matrix.desktop }} -p corvid-agent-deck --bin corvid-agent-deck grid_routes_clicks_to_local_and_two_ssh_scopes -- --ignored --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: remote-update-preview-${{ matrix.desktop }}
          path: target/remote-update-prompt.png
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agent-deck-preview-${{ matrix.desktop }}
          path: |
            target/agent-deck-ready.png
            target/agent-deck-settings.png
            target/agent-deck-run-history.png
            target/agent-deck-multi-host.png
            target/agent-deck-tooltip.png
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workspace-directory-preview-${{ matrix.desktop }}
          path: |
            target/workspace-directory.png
            target/desktop-close-confirmation.png
            target/pane-close-before.png
            target/pane-close-after.png
            target/agent-history.png
            target/scroll-history.png
            target/scroll-live.png
            target/tab-search.png
          if-no-files-found: error
      - name: Stage binaries for Desktop integration
        if: inputs.package
        shell: bash
        run: |
          mkdir -p target/desktop-binaries
          cp target/${{ matrix.desktop }}/release/{corvid-desktop,corvid-agent-deck} target/desktop-binaries/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.package
        with:
          name: binaries-desktop-${{ matrix.desktop }}
          path: target/desktop-binaries/
          if-no-files-found: error

  windows-runtime:
    name: Windows Runtime (${{ matrix.runner }})
    strategy: &windows-targets
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            runtime: x86_64-pc-windows-msvc
            desktop: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            runtime: aarch64-pc-windows-msvc
            desktop: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: rustup target add ${{ matrix.runtime }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *runtime-cache
      - name: Build runtime and launchers
        run: cargo build --locked --release --target ${{ matrix.runtime }} -p corvid-tui -p corvid-update
      - name: Runtime tests
        run: cargo test --locked --release --target ${{ matrix.runtime }} -p corvid-tui -p corvid-daemon -p corvid-client -p corvid-update
      - name: Runtime manifest
        if: inputs.package
        run: python deploy/package.py runtime --target ${{ matrix.runtime }} --binary target/${{ matrix.runtime }}/release/corvid.exe --output target/runtime
      - name: Package TUI
        if: inputs.package
        run: python deploy/package.py package --product tui --target ${{ matrix.runtime }} --runtime target/runtime --build target/${{ matrix.runtime }}/release --output target/dist
      - name: Validate installation and daemon lifecycle
        if: inputs.package
        run: python deploy/test_install.py --assets target/dist --binary target/${{ matrix.runtime }}/release/corvid.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.package
        with:
          name: runtime-${{ matrix.runtime }}
          path: target/runtime/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.package
        with:
          name: tui-${{ matrix.runtime }}
          path: target/dist/
          if-no-files-found: error

  windows-desktop:
    name: Windows Desktop (${{ matrix.runner }})
    strategy: *windows-targets
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *desktop-cache
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: rustup target add ${{ matrix.desktop }}
      - name: Build Desktop and plugins
        run: cargo build --locked --release --target ${{ matrix.desktop }} -p corvid-tui -p corvid-desktop -p corvid-deck -p corvid-agent-deck -p corvid-update
      - name: Workspace tests
        run: cargo test --locked --release --target ${{ matrix.desktop }} --workspace
      - name: Workspace lints
        run: cargo clippy --locked --release --target ${{ matrix.desktop }} --workspace --all-targets -- -D warnings
      - name: Stage binaries for Desktop integration
        if: inputs.package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/desktop-binaries | Out-Null
          $binaries = @(
            'corvid-desktop.exe',
            'corvid-agent-deck.exe',
            'corvid-launch.exe',
            'corvid-desktop-launch.exe',
            'corvid-agent-deck-launch.exe',
            'corvid-deck.exe'
          )
          foreach ($binary in $binaries) {
            Copy-Item -LiteralPath "target/${{ matrix.desktop }}/release/$binary" -Destination target/desktop-binaries
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.package
        with:
          name: binaries-desktop-${{ matrix.desktop }}
          path: target/desktop-binaries/
          if-no-files-found: error

  macos-runtime:
    name: macOS Runtime (${{ matrix.runner }})
    strategy: &macos-targets
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            runtime: aarch64-apple-darwin
            desktop: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: rustup target add ${{ matrix.runtime }}
      - name: macOS build environment
        run: bash deploy/macos/prepare-build.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *runtime-cache
      - name: Build runtime and launchers
        run: cargo build --locked --release --target ${{ matrix.runtime }} -p corvid-tui -p corvid-update
      - name: Runtime tests
        run: cargo test --locked --release --target ${{ matrix.runtime }} -p corvid-tui -p corvid-daemon -p corvid-client -p corvid-update
      - name: Unix PTY qualification
        timeout-minutes: 10
        run: |
          cargo build --locked --release --target ${{ matrix.runtime }} -p corvid-terminal-spike
          python3 spikes/terminal/tests/interactive.py target/${{ matrix.runtime }}/release/corvid-terminal-spike
      - name: macOS interactive TTY lifecycle
        timeout-minutes: 10
        run: python3 crates/corvid-tui/tests/interactive.py --tty-only target/${{ matrix.runtime }}/release/corvid
      - name: Retained Unix agent monitoring
        timeout-minutes: 10
        run: |
          if ! command -v protoc >/dev/null; then
            brew install protobuf
          fi
          python3 crates/corvid-tui/tests/agent_handoff.py target/${{ matrix.runtime }}/release/corvid
      - name: Runtime manifest
        if: inputs.package
        run: python deploy/package.py runtime --target ${{ matrix.runtime }} --binary target/${{ matrix.runtime }}/release/corvid --output target/runtime
      - name: Package TUI
        if: inputs.package
        run: python deploy/package.py package --product tui --target ${{ matrix.runtime }} --runtime target/runtime --build target/${{ matrix.runtime }}/release --output target/dist
      - name: Validate installation and daemon lifecycle
        if: inputs.package
        run: python deploy/test_install.py --assets target/dist --binary target/${{ matrix.runtime }}/release/corvid
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.package
        with:
          name: runtime-${{ matrix.runtime }}
          path: target/runtime/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.package
        with:
          name: tui-${{ matrix.runtime }}
          path: target/dist/
          if-no-files-found: error

  macos-desktop:
    name: macOS Desktop (${{ matrix.runner }})
    strategy: *macos-targets
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: macOS build environment
        run: bash deploy/macos/prepare-build.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *desktop-cache
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: rustup target add ${{ matrix.desktop }}
      - name: Build Desktop and plugins
        run: cargo build --locked --release --target ${{ matrix.desktop }} -p corvid-tui -p corvid-desktop -p corvid-deck -p corvid-agent-deck -p corvid-update --features corvid-deck/stream-deck
      - name: Workspace tests
        run: cargo test --locked --release --target ${{ matrix.desktop }} --workspace --features corvid-deck/stream-deck
      - name: Workspace lints
        run: cargo clippy --locked --release --target ${{ matrix.desktop }} --workspace --all-targets --features corvid-deck/stream-deck -- -D warnings
      - name: Stage binaries for Desktop integration
        if: inputs.package
        shell: bash
        run: |
          mkdir -p target/desktop-binaries
          cp target/${{ matrix.desktop }}/release/{corvid-desktop,corvid-agent-deck,corvid-deck,corvid-streamdeck} target/desktop-binaries/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.package
        with:
          name: binaries-desktop-${{ matrix.desktop }}
          path: target/desktop-binaries/
          if-no-files-found: error
