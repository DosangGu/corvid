name: Checks / Desktop

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checks-desktop.yml'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'LICENSE'
      - 'assets/icons/**'
      - 'assets/fonts/**'
      - 'crates/corvid-core/**'
      - 'crates/corvid-protocol/**'
      - 'crates/corvid-daemon/**'
      - 'crates/corvid-update/**'
      - 'deploy/macos/relaunch.swift'
      - 'deploy/macos_package.py'
      - 'deploy/macos_dock_fixture.swift'
      - 'deploy/test_macos_dock_update.py'
      - 'crates/corvid-client/**'
      - 'crates/corvid-companion/**'
      - 'plugins/agent-deck/**'
      - 'crates/corvid-agent-deck-core/**'
      - 'crates/corvid-presentation/**'
      - 'crates/corvid-desktop/**'
      - 'crates/corvid-tui/build.rs'
      - 'crates/corvid-tui/Cargo.toml'
      - 'crates/corvid-tui/corvid.terminfo'
      - 'crates/corvid-tui/assets/**'
      - 'crates/corvid-tui/src/**'
      - '!crates/corvid-tui/src/main.rs'

permissions:
  contents: read

concurrency:
  group: checks-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update --error-on=any
          sudo apt-get -o Acquire::Retries=3 install -y build-essential libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libudev-dev libfontconfig1-dev libssl-dev ncurses-bin libvulkan1 mesa-vulkan-drivers xvfb xauth fonts-dejavu-core fonts-noto-color-emoji
      - name: Prepare private test directory
        run: |
          mkdir -m 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: checks-desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**', '.github/workflows/checks-desktop.yml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: checks-desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**', '.github/workflows/checks-desktop.yml') }}-
      - run: cargo clippy --locked -p corvid-desktop --all-targets -- -D warnings
      - name: Desktop unit and IPC fixture tests
        # Real-daemon terminal, relaunch and recovery scenarios run in release qualification.
        run: >
          cargo test --locked -p corvid-desktop --bin corvid-desktop --
          --skip terminal_session::inventory_watch::terminal_tests
          --skip terminal_session::restore_test::desktop_relaunch_restores_the_same_terminal
          --skip terminal_session::restore_test::desktop_startup_attempts_recovery_and_leaves_failed_panes_empty
      - name: Desktop font fallback and emoji presentation
        run: xvfb-run -a cargo test --locked -p corvid-desktop --test desktop_symbols

  native-fonts:
    name: Desktop fonts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - name: macOS build environment
        if: runner.os == 'macOS'
        run: bash deploy/macos/prepare-build.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target/debug
          key: checks-desktop-fonts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.github/workflows/checks-desktop.yml', 'Cargo.lock') }}
      - name: Build Desktop and Agent Deck
        run: cargo build --locked -p corvid-desktop -p corvid-agent-deck
      - name: Desktop font fallback and emoji presentation
        run: cargo test --locked -p corvid-desktop --test desktop_symbols
      - name: Relaunch a pinned macOS Desktop through the installed bundle
        if: runner.os == 'macOS'
        run: python3 deploy/test_macos_dock_update.py --relaunch-binary target/debug/corvid-desktop
