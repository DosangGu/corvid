name: Checks / WSL 2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checks-wsl.yml'
      - 'deploy/test_wsl.py'
      - 'crates/corvid-client/src/endpoint/**'
      - 'crates/corvid-desktop/src/terminal_session/wsl_test.rs'
  workflow_dispatch:
  workflow_call:
    inputs:
      require_runtime:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      available: ${{ steps.probe.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download Alpine fixture
        shell: pwsh
        run: |
          $image = 'alpine-minirootfs-3.22.8-x86_64.tar.gz'
          Invoke-WebRequest "https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/$image" -OutFile rootfs.tar.gz -MaximumRetryCount 3
          $expected = '2d7f46af9b7e86ad64ebeba3fe9b75b62dd5b259e708afb2ab21268f627696e5'
          if ((Get-FileHash -Algorithm SHA256 rootfs.tar.gz).Hash -ne $expected) {
            throw 'Alpine rootfs checksum mismatch'
          }
      - name: Boot a disposable WSL 2 distribution
        id: probe
        continue-on-error: true
        run: python deploy/test_wsl.py --rootfs rootfs.tar.gz --probe
      - name: Record unavailable WSL 2 environment
        if: steps.probe.outcome != 'success'
        shell: pwsh
        env:
          CORVID_REQUIRE_WSL: ${{ inputs.require_runtime || github.event_name == 'workflow_dispatch' }}
        run: |
          'WSL 2 did not boot on this runner. Lifecycle qualification was skipped.' >> $env:GITHUB_STEP_SUMMARY
          if ($env:CORVID_REQUIRE_WSL -eq 'true') { throw 'WSL 2 did not boot' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.probe.outcome == 'success'
        with:
          name: wsl-rootfs
          path: rootfs.tar.gz
          if-no-files-found: error

  daemon:
    needs: probe
    if: needs.probe.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update --error-on=any
          sudo apt-get -o Acquire::Retries=3 install -y ncurses-bin musl-tools
          rustup toolchain install --no-self-update
          rustup target add x86_64-unknown-linux-musl
      - uses: ./.github/actions/install-zig
      - name: Build the Linux daemon for WSL
        env:
          CC: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p corvid-daemon --bin corvidd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wsl-daemon
          path: target/x86_64-unknown-linux-musl/release/corvidd
          if-no-files-found: error

  lifecycle:
    needs: [probe, daemon]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-zig
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: wsl-*
          path: target/wsl
          merge-multiple: true
      - name: Build the Desktop test executable
        shell: pwsh
        run: |
          rustup toolchain install --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release --target x86_64-pc-windows-msvc -p corvid-desktop --bin corvid-desktop --no-run --message-format=json-render-diagnostics > target/wsl/cargo.jsonl
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Get-Content target/wsl/cargo.jsonl | ForEach-Object { ConvertFrom-Json $_ } | ForEach-Object { $_.message.rendered }
            exit $exitCode
          }
      - name: Verify WSL installation and terminal handoff
        shell: pwsh
        run: |
          $artifacts = @(Get-Content target/wsl/cargo.jsonl | ForEach-Object { ConvertFrom-Json $_ } | Where-Object { $_.executable -and $_.profile.test })
          if ($artifacts.Length -ne 1) { throw 'Expected one Desktop test executable' }
          python deploy/test_wsl.py --rootfs target/wsl/rootfs.tar.gz --daemon target/wsl/corvidd --desktop-test $artifacts[0].executable
