name: Build and Test Desktop

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      target:
        type: string
        required: true
      package:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  MACOSX_DEPLOYMENT_TARGET: '15.0'
  PYTHONUNBUFFERED: '1'

jobs:
  desktop:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux Desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ncurses-bin libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libudev-dev libfontconfig1-dev libssl-dev libvulkan1 mesa-vulkan-drivers xvfb xauth x11-utils xdotool xclip openbox openssh-server protobuf-compiler scrot
          sudo mkdir -p /run/sshd
          mkdir -p "$HOME/.corvid-tests"
          chmod 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      - name: macOS build environment
        if: runner.os == 'macOS'
        run: bash deploy/macos/prepare-build.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ inputs.target }}/release
          key: desktop-${{ runner.os }}-${{ inputs.target }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            desktop-${{ runner.os }}-${{ inputs.target }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            desktop-${{ runner.os }}-${{ inputs.target }}-v1-
      - run: rustup target add ${{ inputs.target }}
      - name: Build Desktop and plugins
        run: cargo build --locked --release --target ${{ inputs.target }} -p corvid-tui -p corvid-desktop -p corvid-deck -p corvid-agent-deck -p corvid-update ${{ runner.os == 'macOS' && '--features corvid-deck/stream-deck' || '' }}
      - name: Workspace tests
        run: cargo test --locked --release --target ${{ inputs.target }} --workspace ${{ runner.os == 'macOS' && '--features corvid-deck/stream-deck' || '' }}
      - name: Workspace lints
        run: cargo clippy --locked --release --target ${{ inputs.target }} --workspace --all-targets ${{ runner.os == 'macOS' && '--features corvid-deck/stream-deck' || '' }} -- -D warnings
      - name: Linux Desktop title synchronization over SSH
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: python3 deploy/test_title_ssh.py --binary target/${{ inputs.target }}/release/corvid --target ${{ inputs.target }} --release
      - name: Linux Desktop UI interactions
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          CORVID_AGENT_DECK_SCREENSHOT: target/agent-deck-ready.png
          CORVID_AGENT_DECK_SETTINGS_SCREENSHOT: target/agent-deck-settings.png
          CORVID_WORKSPACE_SCREENSHOT: target/workspace-directory.png
          CORVID_CLOSE_SCREENSHOT: target/desktop-close-confirmation.png
          CORVID_PANE_CLOSE_PREVIEW_DIR: target
          CORVID_SCROLL_PREVIEW_DIR: target
        run: xvfb-run -a python3 deploy/test_desktop.py --build target/${{ inputs.target }}/release
      - name: Connected managed SSH updates
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: xvfb-run -a python3 deploy/test_remote_update.py --build target/${{ inputs.target }}/release --target ${{ inputs.target }} --screenshot target/remote-update-prompt.png
      - name: Linux Agent Deck card focus
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run -a python3 deploy/test_deck_focus.py --build target/${{ inputs.target }}/release --history-screenshot target/agent-deck-run-history.png
      - name: Linux Agent Deck multi-host grid
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          CORVID_MULTI_HOST_GRID_SCREENSHOT: ${{ github.workspace }}/target/agent-deck-multi-host.png
        run: |
          runtime=$(mktemp -d "$HOME/.cv-grid-XXXXXX")
          trap 'rm -rf -- "$runtime"' EXIT
          XDG_RUNTIME_DIR="$runtime" xvfb-run -a cargo test --locked --release --target ${{ inputs.target }} -p corvid-agent-deck --bin corvid-agent-deck grid_routes_clicks_to_local_and_two_ssh_scopes -- --ignored --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: remote-update-preview-${{ inputs.target }}
          path: target/remote-update-prompt.png
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: agent-deck-preview-${{ inputs.target }}
          path: |
            target/agent-deck-ready.png
            target/agent-deck-settings.png
            target/agent-deck-run-history.png
            target/agent-deck-multi-host.png
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: workspace-directory-preview-${{ inputs.target }}
          path: |
            target/workspace-directory.png
            target/desktop-close-confirmation.png
            target/pane-close-before.png
            target/pane-close-after.png
            target/agent-history.png
            target/scroll-history.png
            target/scroll-live.png
            target/tab-search.png
          if-no-files-found: error
      - name: Stage binaries for Desktop integration
        if: inputs.package
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $binaries = @("corvid-desktop$suffix", "corvid-agent-deck$suffix")
          if ($IsWindows) {
            $binaries += @('corvid-launch.exe', 'corvid-desktop-launch.exe', 'corvid-agent-deck-launch.exe', 'corvid-deck.exe')
          }
          if ($IsMacOS) { $binaries += @('corvid-deck', 'corvid-streamdeck') }
          New-Item -ItemType Directory -Path target/desktop-binaries | Out-Null
          foreach ($binary in $binaries) {
            Copy-Item -LiteralPath "target/${{ inputs.target }}/release/$binary" -Destination target/desktop-binaries
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.package
        with:
          name: binaries-desktop-${{ inputs.target }}
          path: target/desktop-binaries/
          if-no-files-found: error
