name: Checks / libghostty-vt

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checks-ghostty.yml'
      - '.github/actions/install-zig/**'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/corvid-daemon/Cargo.toml'
      - 'crates/corvid-daemon/src/terminal/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-ghostty-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  native:
    name: libghostty-vt (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            runtime: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            runtime: aarch64-unknown-linux-musl
          - runner: windows-latest
            runtime: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            runtime: aarch64-pc-windows-msvc
          - runner: macos-latest
            runtime: aarch64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      RUST_TARGET: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update --error-on=any
          sudo apt-get -o Acquire::Retries=3 install -y musl-tools ncurses-bin
          target_key=$(printf '%s' "$RUST_TARGET" | tr '[:lower:]-' '[:upper:]_')
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${target_key}_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - name: Prepare private Unix test directory
        if: runner.os != 'Windows'
        run: |
          temp_dir=$(mktemp -d "$HOME/cghost-XXXXXX")
          echo "TMPDIR=$temp_dir" >> "$GITHUB_ENV"
          echo "CORVID_TEST_TMPDIR=$temp_dir" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install-zig
      - name: Install Rust toolchain and target
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustup target add "$RUST_TARGET"
      - name: Run linked VT and adapter fixtures
        shell: bash
        run: cargo test --locked --target "$RUST_TARGET" -p corvid-daemon --lib terminal::screen::ghostty_qualification
      - name: Verify Linux idle scrollback compression
        if: runner.os == 'Linux'
        run: cargo test --locked --target "$RUST_TARGET" -p corvid-daemon --lib idle_compression_preserves_history_and_restarts_after_scroll
      - name: Build the Ghostty daemon and TUI
        shell: bash
        run: cargo build --locked --target "$RUST_TARGET" -p corvid-daemon -p corvid-tui
      - name: Verify Unix PTY routing and handoff
        if: runner.os == 'Linux'
        run: cargo test --locked --target "$RUST_TARGET" -p corvid-tui --test routing -- --test-threads=4
      - name: Verify Unix terminal relay
        if: runner.os != 'Windows'
        run: cargo test --locked --target "$RUST_TARGET" -p corvid-tui --test control relays_daemon_terminal_frames_without_an_outer_tty
      - name: Verify Windows ConPTY shell history
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --locked --target "$RUST_TARGET" -p corvid-daemon --lib wheel_history_stays_live_while_powershell_runs_a_console_program
      - name: Verify Windows concurrent daemon startup
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --locked --target "$RUST_TARGET" -p corvid-tui --test windows_daemon ensure_daemon_
      - name: Remove Unix test directory
        if: ${{ always() && env.CORVID_TEST_TMPDIR != '' }}
        shell: bash
        run: rmdir "$CORVID_TEST_TMPDIR"
