name: Checks / libghostty-vt

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checks-ghostty.yml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/corvid-daemon/Cargo.toml'
      - 'crates/corvid-daemon/src/terminal/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-ghostty-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  ZIG_VERSION: '0.17.1'

jobs:
  native:
    name: libghostty-vt (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            runtime: x86_64-unknown-linux-musl
            zig: x86_64-linux
            suffix: tar.xz
            sha256: 3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
          - runner: ubuntu-26.04-arm
            runtime: aarch64-unknown-linux-musl
            zig: aarch64-linux
            suffix: tar.xz
            sha256: a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795
          - runner: windows-latest
            runtime: x86_64-pc-windows-msvc
            zig: x86_64-windows
            suffix: zip
            sha256: b03f477a1943673e02aca0f570e8030dffd536ce1f45cbc4d3326ec31159562e
          - runner: windows-11-arm
            runtime: aarch64-pc-windows-msvc
            zig: aarch64-windows
            suffix: zip
            sha256: 4789895bdb1e312a2ea73b2a7c0a0cc8d2ab62ba6976e834a7c54cf443377c15
          - runner: macos-latest
            runtime: aarch64-apple-darwin
            zig: aarch64-macos
            suffix: tar.xz
            sha256: 75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d
    env:
      CORVID_VT_ENGINE: ghostty
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      RUST_TARGET: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update --error-on=any
          sudo apt-get -o Acquire::Retries=3 install -y musl-tools ncurses-bin
          target_key=$(printf '%s' "$RUST_TARGET" | tr '[:lower:]-' '[:upper:]_')
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${target_key}_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - name: Prepare private Unix test directory
        if: runner.os != 'Windows'
        run: |
          temp_dir=$(mktemp -d "$HOME/cghost-XXXXXX")
          echo "TMPDIR=$temp_dir" >> "$GITHUB_ENV"
          echo "CORVID_TEST_TMPDIR=$temp_dir" >> "$GITHUB_ENV"
      - name: Install pinned Zig
        shell: pwsh
        env:
          ZIG_PLATFORM: ${{ matrix.zig }}
          ZIG_SUFFIX: ${{ matrix.suffix }}
          ZIG_SHA256: ${{ matrix.sha256 }}
        run: |
          $stem = "zig-$env:ZIG_PLATFORM-$env:ZIG_VERSION"
          $name = "$stem.$env:ZIG_SUFFIX"
          $archive = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest "https://ziglang.org/download/$env:ZIG_VERSION/$name" -OutFile $archive -MaximumRetryCount 3
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne $env:ZIG_SHA256) {
            throw "Zig download checksum mismatch"
          }
          if ($env:ZIG_SUFFIX -eq 'zip') {
            Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          } else {
            tar -xJf $archive -C $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          (Join-Path $env:RUNNER_TEMP $stem) >> $env:GITHUB_PATH
      - name: Install Rust toolchain and target
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustup target add "$RUST_TARGET"
      - name: Run linked VT and adapter fixtures
        shell: bash
        run: cargo test --locked --target "$RUST_TARGET" -p corvid-daemon --features ghostty-vt --lib terminal::screen::ghostty_qualification
      - name: Build the opt-in daemon and TUI
        shell: bash
        run: cargo build --locked --target "$RUST_TARGET" -p corvid-daemon -p corvid-tui --features corvid-daemon/ghostty-vt
      - name: Verify Unix PTY routing and handoff
        if: runner.os == 'Linux'
        run: cargo test --locked --target "$RUST_TARGET" -p corvid-tui --test routing -- --test-threads=4
      - name: Verify Unix terminal relay
        if: runner.os != 'Windows'
        run: cargo test --locked --target "$RUST_TARGET" -p corvid-tui --test control relays_daemon_terminal_frames_without_an_outer_tty
      - name: Verify Windows ConPTY shell history
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --locked --target "$RUST_TARGET" -p corvid-daemon --features ghostty-vt --lib wheel_history_stays_live_while_powershell_runs_a_console_program
      - name: Verify Windows concurrent daemon startup
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --locked --target "$RUST_TARGET" -p corvid-tui --test windows_daemon ensure_daemon_
      - name: Remove Unix test directory
        if: ${{ always() && env.CORVID_TEST_TMPDIR != '' }}
        shell: bash
        run: rmdir "$CORVID_TEST_TMPDIR"
