name: Checks / Compio IPC

on:
  pull_request:
    paths:
      - '.github/workflows/checks-compio.yml'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/corvid-async/**'
      - 'crates/corvid-protocol/**'
      - 'crates/corvid-client/**'
      - 'crates/corvid-companion/**'
      - 'crates/corvid-daemon/**'
      - 'crates/corvid-tui/**'
      - 'crates/corvid-desktop/**'
      - 'crates/corvid-presentation/**'
      - 'crates/corvid-agent-deck-core/**'
      - 'plugins/agent-deck/**'
      - 'assets/fonts/**'
      - 'assets/icons/**'

permissions:
  contents: read

concurrency:
  group: checks-compio-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  ipc:
    name: Compio IPC (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Check shared synchronization
        run: cargo test --locked -p corvid-async
      - name: Compile the protocol library with only the Compio backend
        run: cargo check --locked -p corvid-protocol --no-default-features --features compio --lib
      - name: Compile and test framing and private listeners
        run: cargo test --locked -p corvid-protocol --features compio --test framing --test compio_listeners
      - name: Exercise a detached Compio companion on Windows
        if: runner.os == 'Windows'
        run: cargo test --locked -p corvid-tui --features compio-daemon,compio-endpoints --test monitor compio_companion_serves_while_detached
      - name: Exercise actual Unix CLI and relays
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: cargo test --locked -p corvid-tui --features compio-probe --test routing compio_
      - name: Exercise actual Windows daemon and Compio client
        if: runner.os == 'Windows'
        run: cargo test --locked -p corvid-tui --features compio-probe --test windows_daemon compio_
      - name: Exercise Unix daemon IPC on Compio
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          cargo test --locked -p corvid-tui --features compio-daemon,compio-probe --test routing compio_
          cargo test --locked -p corvid-tui --features compio-daemon --test routing malformed_and_stalled_frames
          cargo test --locked -p corvid-tui --features compio-daemon --test routing snapshot_client_keeps_last_state
          cargo test --locked -p corvid-tui --features compio-daemon --test routing crash_restores_layout
      - name: Exercise Windows daemon IPC and ConPTY on Compio
        if: runner.os == 'Windows'
        run: |
          cargo test --locked -p corvid-tui --features compio-daemon,compio-probe --test windows_daemon compio_
          cargo test --locked -p corvid-tui --features compio-daemon --test windows_daemon takeover_and_disconnect
          cargo test --locked -p corvid-tui --features compio-daemon --test windows_daemon upgrade_preserves_the_windows_shell
      - name: Exercise Unix Compio observers across daemon handoff
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: cargo test --locked -p corvid-tui --features compio-daemon,compio-probe --test routing claude_update_restart -- --test-threads=1
      - name: Exercise Windows Compio observers in ConPTY
        if: runner.os == 'Windows'
        run: cargo test --locked -p corvid-tui --features compio-daemon,compio-probe --test windows_daemon windows_shell_hooks_publish_only_bound_provider_observations
      - name: Exercise Compio TUI in a Unix PTY
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          cargo test --locked -p corvid-tui --features compio-daemon,compio-probe,compio-tui --test scripted_attach
          python3 crates/corvid-tui/tests/interactive.py target/debug/corvid --tty-only
      - name: Exercise Compio TUI in ConPTY
        if: runner.os == 'Windows'
        run: |
          cargo test --locked -p corvid-tui --features compio-daemon,compio-probe,compio-tui --test windows_daemon ordinary_attach_resumes
          cargo test --locked -p corvid-tui --features compio-daemon,compio-probe,compio-tui --test windows_daemon command_menu_consumes_input
      - name: Exercise Compio local control and interactive endpoints on Unix
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          cargo test --locked -p corvid-tui --features compio-endpoints,compio-daemon --test workspace_directory
          cargo test --locked -p corvid-tui --features compio-endpoints,compio-daemon --test routing snapshot_client_keeps_last_state
          cargo test --locked -p corvid-tui --features compio-endpoints,compio-daemon --test routing compio_snapshot_watch_
      - name: Exercise Compio local control endpoints on Windows
        if: runner.os == 'Windows'
        run: cargo test --locked -p corvid-tui --features compio-endpoints,compio-daemon --test windows_daemon tui_reopens_its_last_workspace
      - name: Exercise Compio child-process I/O and cleanup
        run: cargo test --locked -p corvid-client --features compio-endpoints --lib native_process_transfers
      - name: Exercise the Compio companion presentation server
        run: cargo test --locked -p corvid-tui --features compio-endpoints,compio-daemon --test monitor

  desktop:
    name: Compio Desktop and Agent Deck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update --error-on=any
          sudo apt-get -o Acquire::Retries=3 install -y build-essential libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libudev-dev libfontconfig1-dev libssl-dev ncurses-bin
      - name: Prepare private test directory
        run: |
          mkdir -m 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Exercise workspace inventory and reconnection
        run: cargo test --locked -p corvid-desktop --features compio-endpoints --bin corvid-desktop terminal_session::inventory_watch::tests
      - name: Exercise the Agent Deck presentation and notification fixtures
        run: cargo test --locked -p corvid-agent-deck --features compio-endpoints --bin corvid-agent-deck
