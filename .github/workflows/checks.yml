name: Corvid Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  # A new PR revision replaces its checks while main pushes keep their active run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      package_fallback: ${{ steps.changes.outputs.package_fallback }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate changed paths and whitespace
        id: changes
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: python3 deploy/validate_changes.py
      - run: python3 deploy/release.py validate
      - run: python3 deploy/test_icons.py
      - run: python3 deploy/test_validate_changes.py
      - run: python3 deploy/test_macos_package.py
      - run: python3 deploy/test_package.py
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: cargo fmt --all -- --check

  package-fallback:
    # Cover main pushes that the package workflow's path filter may miss.
    needs: validate
    if: needs.validate.outputs.package_fallback == 'true'
    uses: ./.github/workflows/package.yml

  checks:
    name: Corvid checks
    needs: [validate, package-fallback]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check validation and package fallback
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PACKAGE_FALLBACK: ${{ needs.validate.outputs.package_fallback }}
          PACKAGE_RESULT: ${{ needs.package-fallback.result }}
        run: |
          if [[ "$VALIDATE_RESULT" != success ]]; then
            echo "::error::Validation finished with $VALIDATE_RESULT"
            exit 1
          fi
          case "$PACKAGE_FALLBACK:$PACKAGE_RESULT" in
            true:success|false:skipped) ;;
            *)
              echo "::error::Unexpected package fallback result: $PACKAGE_FALLBACK/$PACKAGE_RESULT"
              exit 1
              ;;
          esac
