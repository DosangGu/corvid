name: Build and Test Runtime

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      target:
        type: string
        required: true
      binary:
        type: string
        default: corvid
      package:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  MACOSX_DEPLOYMENT_TARGET: '15.0'
  PYTHONUNBUFFERED: '1'

jobs:
  runtime:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ncurses-bin binutils musl-tools openssh-server protobuf-compiler zsh
          mkdir -p "$HOME/.corvid-tests"
          chmod 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      - name: Linux musl linker
        if: runner.os == 'Linux'
        run: |
          echo "CC=musl-gcc" >> "$GITHUB_ENV"
          target_key=$(echo '${{ inputs.target }}' | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${target_key}_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - run: rustup target add ${{ inputs.target }}
      - name: macOS build environment
        if: runner.os == 'macOS'
        run: bash deploy/macos/prepare-build.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ inputs.target }}/release
          key: rust-${{ runner.os }}-${{ inputs.target }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ inputs.target }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            rust-${{ runner.os }}-${{ inputs.target }}-v1-
      - name: Build runtime and launchers
        run: cargo build --locked --release --target ${{ inputs.target }} -p corvid-tui -p corvid-update
      - name: Runtime tests
        run: cargo test --locked --release --target ${{ inputs.target }} -p corvid-tui -p corvid-daemon -p corvid-client -p corvid-update
      - name: Unix PTY qualification
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: |
          cargo build --locked --release --target ${{ inputs.target }} -p corvid-terminal-spike
          python3 spikes/terminal/tests/interactive.py target/${{ inputs.target }}/release/corvid-terminal-spike
      - name: Linux interactive TTY and shell lifecycle
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: python3 crates/corvid-tui/tests/interactive.py target/${{ inputs.target }}/release/corvid
      - name: macOS interactive TTY lifecycle
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: python3 crates/corvid-tui/tests/interactive.py --tty-only target/${{ inputs.target }}/release/corvid
      - name: Retained Unix agent monitoring
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: |
          if [ "${{ runner.os }}" = macOS ] && ! command -v protoc >/dev/null; then
            brew install protobuf
          fi
          python3 crates/corvid-tui/tests/agent_handoff.py target/${{ inputs.target }}/release/corvid
      - name: Prepare isolated Linux SSH lifecycle fixture
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /run/sshd
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Linux SSH disconnect and reconnect
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: python3 crates/corvid-tui/tests/ssh_lifecycle.py target/${{ inputs.target }}/release/corvid
      - name: Runtime manifest
        if: inputs.package
        run: python deploy/package.py runtime --target ${{ inputs.target }} --binary target/${{ inputs.target }}/release/${{ inputs.binary }} --output target/runtime
      - name: Package TUI
        if: inputs.package
        run: python deploy/package.py package --product tui --target ${{ inputs.target }} --runtime target/runtime --build target/${{ inputs.target }}/release --output target/dist
      - name: Validate installation and daemon lifecycle
        if: inputs.package
        run: python deploy/test_install.py --assets target/dist --binary target/${{ inputs.target }}/release/${{ inputs.binary }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.package
        with:
          name: runtime-${{ inputs.target }}
          path: target/runtime/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.package
        with:
          name: tui-${{ inputs.target }}
          path: target/dist/
          if-no-files-found: error
