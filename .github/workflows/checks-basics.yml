name: Checks / Basics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-basics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basics:
    name: PR basics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Include the first parent of GitHub's test merge commit.
          fetch-depth: 2
      - name: Check changed lines for whitespace errors
        run: git diff --check HEAD^1 HEAD --
      - run: python3 deploy/release.py validate
      - name: Install pyflakes3
        uses: ./.github/actions/apt-install
        with:
          packages: pyflakes3
      - name: Check Python test and packaging scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t py_files < <(git ls-files '*.py')
          python3 -m py_compile "${py_files[@]}"
          if pyflakes3 "${py_files[@]}" 2>&1 | tee "$RUNNER_TEMP/pyflakes.log" | grep -E 'undefined name|syntax error|invalid syntax'; then
            echo "Found Python undefined names or syntax errors" >&2
            exit 1
          fi
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: cargo fmt --all -- --check
