name: Checks / Core and daemon

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checks-daemon.yml'
      - '.github/actions/install-zig/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'LICENSE'
      - 'crates/corvid-async/**'
      - 'crates/corvid-client/**'
      - 'crates/corvid-core/**'
      - 'crates/corvid-protocol/**'
      - 'crates/corvid-daemon/**'
      - 'crates/corvid-update/**'

permissions:
  contents: read

concurrency:
  group: checks-daemon-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  daemon:
    name: Core and daemon
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-zig
      - name: Install the terminfo compiler
        run: |
          sudo apt-get -o Acquire::Retries=3 update --error-on=any
          sudo apt-get -o Acquire::Retries=3 install -y ncurses-bin
      - name: Prepare private test directory
        run: |
          mkdir -m 700 "$HOME/.corvid-tests"
          echo "TMPDIR=$HOME/.corvid-tests" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: checks-daemon-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**', '.github/workflows/checks-daemon.yml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: checks-daemon-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**', '.github/workflows/checks-daemon.yml') }}-
      - name: Reject Tokio in the Linux dependency graph
        shell: bash
        run: |
          cargo tree --locked --workspace --all-features --edges normal,build,dev \
            --prefix none --format '{p}' > "$RUNNER_TEMP/corvid-native-deps.txt"
          if grep -E '^tokio( |[-_])' "$RUNNER_TEMP/corvid-native-deps.txt"; then
            echo "Tokio is present in the native dependency graph" >&2
            exit 1
          fi
      - name: Compile the protocol library with only the Compio backend
        run: cargo check --locked -p corvid-protocol --no-default-features --features compio --lib
      - run: cargo clippy --locked -p corvid-async -p corvid-core -p corvid-protocol -p corvid-daemon -p corvid-update --all-targets -- -D warnings
      - run: cargo test --locked -p corvid-async -p corvid-core -p corvid-protocol -p corvid-daemon -p corvid-update
