name: Publish Corvid to crates.io

on:
  push:
    tags: ['crates-io-v*']

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'DosangGu/corvid' && github.event.created
    runs-on: ubuntu-latest
    environment: crates.io
    steps:
      - name: Resolve the published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=${GITHUB_REF_NAME#crates-io-}
          published_tag=$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft --jq 'select(.isDraft == false) | .tagName')
          if [[ "$published_tag" != "$release_tag" ]]; then
            echo "Expected a published GitHub release for $release_tag" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/install-zig
        if: hashFiles('.github/actions/install-zig/action.yml') != ''
      - name: Install build tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update --error-on=any
          sudo apt-get -o Acquire::Retries=3 install -y ncurses-bin
          rustup toolchain install --no-self-update
      - name: Publish Corvid crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          until GITHUB_REF="refs/tags/$RELEASE_TAG" python3 deploy/crates_io.py publish 2>&1 | tee "$log"; do
            retry_at=$(
              sed -nE 's/.*status 429 Too Many Requests.*try again after (.* GMT).*/\1/p' "$log" |
                tail -n 1
            )
            if [[ -z "$retry_at" ]]; then
              exit 1
            fi

            retry_epoch=$(date -u -d "$retry_at" +%s)
            delay=$((retry_epoch - $(date -u +%s) + 15))
            echo "crates.io asked to retry after $retry_at."
            if (( delay > 0 )); then
              sleep "$delay"
            fi
          done
      - name: Verify the registry installation
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version=${RELEASE_TAG#v}
          install_root="$RUNNER_TEMP/corvid-crates-io"
          cargo install --locked --registry crates-io --root "$install_root" --version "$version" corvid-tui
          test "$("$install_root/bin/corvid" --version)" = "corvid $version"
