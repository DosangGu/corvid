name: Checks / Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checks-release.yml'
      - 'deploy/release-notes.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Release package and UI qualification
    uses: ./.github/workflows/package.yml

  source-packages:
    name: Cargo source packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: target/crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install terminfo compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update --error-on=any
          sudo apt-get -o Acquire::Retries=3 install -y ncurses-bin
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: python deploy/crates_io.py verify
