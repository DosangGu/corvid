name: Install pinned Zig
description: Install the verified Zig toolchain for libghostty-vt
runs:
  using: composite
  steps:
    - name: Restore cached Zig archive
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/corvid-zig-cache
        key: zig-0.17.1-${{ runner.os }}-${{ runner.arch }}
    - name: Download, verify, and extract Zig
      shell: pwsh
      run: |
        $version = '0.17.1'
        $archives = @{
          'Linux/X64' = @('x86_64-linux', 'tar.xz', '3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a')
          'Linux/ARM64' = @('aarch64-linux', 'tar.xz', 'a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795')
          'Windows/X64' = @('x86_64-windows', 'zip', 'b03f477a1943673e02aca0f570e8030dffd536ce1f45cbc4d3326ec31159562e')
          'Windows/ARM64' = @('aarch64-windows', 'zip', '4789895bdb1e312a2ea73b2a7c0a0cc8d2ab62ba6976e834a7c54cf443377c15')
          'macOS/ARM64' = @('aarch64-macos', 'tar.xz', '75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d')
        }
        $target = "$env:RUNNER_OS/$env:RUNNER_ARCH"
        if (!$archives.ContainsKey($target)) { throw "Unsupported Zig host $target" }
        $platform, $suffix, $sha256 = $archives[$target]
        $stem = "zig-$platform-$version"
        $filename = "$stem.$suffix"
        $cacheDir = Join-Path $env:RUNNER_TEMP 'corvid-zig-cache'
        New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
        $archive = Join-Path $cacheDir $filename

        $cached = $false
        if (Test-Path -LiteralPath $archive) {
          $cachedHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($cachedHash -eq $sha256) {
            Write-Host "Using cached Zig archive $filename"
            $cached = $true
          } else {
            Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          }
        }

        if (!$cached) {
          $curl = if ($env:RUNNER_OS -eq 'Windows') { 'curl.exe' } else { 'curl' }
          # Zig lists the fallbacks at https://ziglang.org/download/community-mirrors.txt.
          $urls = @(
            "https://ziglang.org/download/$version/$filename",
            "https://zig.squirl.dev/${filename}?source=corvid-ci",
            "https://zig.chainsafe.dev/${filename}?source=corvid-ci",
            "https://pkg.earth/zig/${filename}?source=corvid-ci",
            "https://pkg.hexops.org/zig/${filename}?source=corvid-ci"
          )
          $timer = [System.Diagnostics.Stopwatch]::new()
          foreach ($url in $urls) {
            $timer.Restart()
            & $curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' `
              --connect-timeout 10 --max-time 60 --speed-limit 262144 --speed-time 15 `
              --retry 0 --remove-on-error --output $archive $url
            $downloadStatus = $LASTEXITCODE
            $sourceHost = ([Uri]$url).Host
            Write-Host "Zig download from $sourceHost took $([Math]::Round($timer.Elapsed.TotalSeconds, 1)) s (curl exit $downloadStatus)"
            if ($downloadStatus -eq 0) { break }
          }
          if ($downloadStatus -ne 0) { exit $downloadStatus }

          $timer.Restart()
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          Write-Host "Zig checksum took $([Math]::Round($timer.Elapsed.TotalSeconds, 1)) s"
          if ($actual -ne $sha256) {
            Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
            throw 'Zig download checksum mismatch'
          }
        }

        $timer = [System.Diagnostics.Stopwatch]::new()
        $timer.Restart()
        if ($suffix -eq 'zip') {
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $env:RUNNER_TEMP, $true)
        } else {
          tar -xJf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        Write-Host "Zig extraction took $([Math]::Round($timer.Elapsed.TotalSeconds, 1)) s"
        (Join-Path $env:RUNNER_TEMP $stem) >> $env:GITHUB_PATH
