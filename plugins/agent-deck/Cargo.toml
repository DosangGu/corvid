[package]
name = "corvid-agent-deck-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Agent activity and focus controls for Corvid"
publish.workspace = true

[[bin]]
name = "corvid-agent-deck"
path = "src/main.rs"

[dependencies]
compio.workspace = true
corvid-async.workspace = true
async-process.workspace = true
anyhow.workspace = true
clap.workspace = true
corvid-agent-deck.workspace = true
corvid-agent-deck-core.workspace = true
corvid-client.workspace = true
corvid-companion.workspace = true
corvid-presentation.workspace = true
corvid-protocol = { workspace = true, features = ["compio", "borrowed-io"] }
corvid-update.workspace = true
uuid.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
image = { workspace = true, features = ["png"] }
gpui = { workspace = true }
gpui_platform = { workspace = true, features = ["x11"] }
x11rb = { workspace = true }

[target.'cfg(windows)'.dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true }
raw-window-handle = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading"] }
windows = { workspace = true, features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT"] }

[build-dependencies]
cc.workspace = true
embed-resource.workspace = true

[dev-dependencies]
tempfile.workspace = true
resvg.workspace = true

[[example]]
name = "render-icons"
path = "tools/render_icons.rs"

[[test]]
name = "windows_update"
harness = false

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tempfile.workspace = true
gpui = { workspace = true }
gpui_platform = { workspace = true, features = ["font-kit"] }
raw-window-handle = { workspace = true }
