[package]
name = "corvid-companion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Controller state and host connections for Corvid"
publish = ["crates-io"]

[features]
compio-endpoints = ["corvid-client/compio-endpoints", "corvid-protocol/compio", "dep:compio", "dep:futures-util"]

[dependencies]
compio = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
anyhow.workspace = true
corvid-client.workspace = true
corvid-protocol.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
uuid.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
socket2.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemServices",
    "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
