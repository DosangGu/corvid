[package]
name = "corvid-companion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
corvid-client.workspace = true
corvid-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
socket2.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemServices",
    "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
