[package]
name = "corvid-companion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Controller state and host connections for Corvid"
publish = ["crates-io"]

[features]
compio-endpoints = []

[dependencies]
corvid-async.workspace = true
async-process.workspace = true
compio.workspace = true
futures-util.workspace = true
anyhow.workspace = true
corvid-client.workspace = true
corvid-protocol = { workspace = true, features = ["compio"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
futures-util = { workspace = true, features = ["io"] }
socket2.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemServices",
    "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "process", "rt"] }
tempfile.workspace = true

[lints]
workspace = true
