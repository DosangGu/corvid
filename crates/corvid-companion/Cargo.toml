[package]
name = "corvid-companion"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
corvid-client.workspace = true
corvid-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
    "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
