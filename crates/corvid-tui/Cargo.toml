[package]
name = "corvid-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Terminal multiplexer for coding agents"
publish = ["crates-io"]

[[bin]]
name = "corvid"
path = "src/main.rs"

[dependencies]
corvid-async.workspace = true
async-process.workspace = true
compio = { workspace = true, features = ["signal"] }
anyhow.workspace = true
clap.workspace = true
corvid-client.workspace = true
corvid-companion.workspace = true
corvid-protocol = { workspace = true, features = ["compio", "borrowed-io"] }
corvid-update.workspace = true
corvid-core.workspace = true
crossterm = { workspace = true, features = ["bracketed-paste", "events", "windows"] }
dunce.workspace = true
sysinfo.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { workspace = true, features = ["fs", "poll"] }
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
sha2.workspace = true
corvid-agent-deck.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console",
    "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading",
] }

[dev-dependencies]
corvid-daemon.workspace = true
portable-pty.workspace = true
tempfile.workspace = true
vt100.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
nix = { workspace = true, features = ["term"] }

[build-dependencies]
embed-resource.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Pipes"] }

[lints]
workspace = true
