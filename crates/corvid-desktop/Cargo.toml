[package]
name = "corvid-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "3"

[[bin]]
name = "corvid-desktop"
path = "src/main.rs"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
corvid-client = { path = "../corvid-client" }
corvid-companion = { path = "../corvid-companion" }
corvid-deck = { path = "../../spikes/deck", default-features = false }
corvid-protocol = { path = "../corvid-protocol" }
glob = "0.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tokio = { version = "=1.53.3", features = ["rt", "sync", "time"] }
uuid = { version = "1.29", features = ["v4"] }
vt100 = { version = "=0.18.1", default-features = false }

[target.'cfg(windows)'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["x11"] }

[target.'cfg(any(windows, target_os = "linux"))'.dev-dependencies]
tempfile = "3.27"

[profile.dev]
debug = 0
