[package]
name = "corvid-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "corvid-desktop"
path = "src/main.rs"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
anyhow.workspace = true
corvid-agent-deck.workspace = true
clap.workspace = true
corvid-client.workspace = true
corvid-companion.workspace = true
corvid-protocol.workspace = true
corvid-tui.workspace = true
corvid-update.workspace = true
glob.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["process", "rt", "sync", "time"] }
uuid.workspace = true
vt100.workspace = true

[target.'cfg(windows)'.dependencies]
gpui = { workspace = true, features = ["windows-manifest"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, features = ["x11"] }
libc.workspace = true

[target.'cfg(any(windows, target_os = "linux"))'.dev-dependencies]
tempfile.workspace = true
