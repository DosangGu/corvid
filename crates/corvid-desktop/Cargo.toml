[package]
name = "corvid-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "corvid-desktop"
path = "src/main.rs"

[[test]]
name = "macos_text"
harness = false

[[test]]
name = "desktop_symbols"
harness = false

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
anyhow.workspace = true
chrono.workspace = true
corvid-agent-deck.workspace = true
clap.workspace = true
corvid-client.workspace = true
corvid-companion.workspace = true
corvid-core.workspace = true
corvid-presentation.workspace = true
corvid-protocol.workspace = true
corvid-tui.workspace = true
corvid-update.workspace = true
glob.workspace = true
hex.workspace = true
qwertty-term-input.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["process", "rt-multi-thread", "sync", "time"] }
unicode-width.workspace = true
url.workspace = true
uuid.workspace = true
vt100.workspace = true

[target.'cfg(windows)'.dependencies]
gpui = { workspace = true, features = ["windows-manifest"] }
gpui_platform = { workspace = true }
raw-window-handle.workspace = true
windows-sys = { workspace = true, features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true, features = ["x11"] }
libc.workspace = true
image = { workspace = true, features = ["png"] }
x11rb.workspace = true

[build-dependencies]
cc.workspace = true
embed-resource.workspace = true

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dev-dependencies]
corvid-daemon.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true, features = ["font-kit"] }
raw-window-handle.workspace = true
tempfile.workspace = true
