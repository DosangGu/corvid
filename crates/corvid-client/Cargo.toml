[package]
name = "corvid-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Client for the Corvid terminal multiplexer daemon"
publish = ["crates-io"]

[features]
compio = []
compio-tui = []
compio-endpoints = []

[dependencies]
corvid-async.workspace = true
async-process.workspace = true
compio = { workspace = true, features = ["macros", "signal"] }
anyhow.workspace = true
base64.workspace = true
corvid-core.workspace = true
corvid-protocol = { workspace = true, features = ["compio"] }
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["io-std", "macros", "net", "process", "rt", "signal", "sync", "time"] }
uuid.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
crossterm.workspace = true
nix = { workspace = true, features = ["term"] }

[target.'cfg(windows)'.dependencies]
crossterm = { workspace = true, features = ["events", "windows"] }
windows-sys = { workspace = true, features = [
    "Win32_System_Console", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
prost.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[example]]
name = "compio-ping"
required-features = ["compio"]
