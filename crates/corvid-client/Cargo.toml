[package]
name = "corvid-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
corvid-core.workspace = true
corvid-protocol.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["io-std", "macros", "net", "process", "rt", "signal", "sync", "time"] }
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
crossterm.workspace = true
nix = { workspace = true, features = ["term"] }

[target.'cfg(windows)'.dependencies]
crossterm = { workspace = true, features = ["events", "windows"] }
windows-sys = { workspace = true, features = [
    "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(windows)'.dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
