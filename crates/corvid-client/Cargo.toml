[package]
name = "corvid-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
corvid-core.workspace = true
corvid-protocol.workspace = true
tokio = { workspace = true, features = ["io-std", "macros", "net", "process", "rt", "signal", "sync", "time"] }
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
crossterm.workspace = true
nix = { workspace = true, features = ["term"] }

[target.'cfg(windows)'.dependencies]
crossterm = { workspace = true, features = ["events", "windows"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Threading",
] }

[lints]
workspace = true
