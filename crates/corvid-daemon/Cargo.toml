[package]
name = "corvid-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "PTY and session daemon for the Corvid terminal multiplexer"
publish = ["crates-io"]

[[bin]]
name = "corvidd"
path = "src/main.rs"

[features]
compio = []
ghostty-vt = ["dep:ghostty-vt", "ghostty-vt/kitty-graphics"]

[dependencies]
corvid-async.workspace = true
compio = { workspace = true, features = ["macros", "signal"] }
futures-util.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
corvid-client.workspace = true
corvid-update.workspace = true
corvid-core.workspace = true
corvid-protocol = { workspace = true, features = ["compio"] }
dunce.workspace = true
ghostty-vt = { workspace = true, optional = true }
portable-pty.workspace = true
prost.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tempfile.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
uuid.workspace = true
vt100.workspace = true
vte.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { workspace = true, features = ["fs", "hostname", "poll", "user"] }
semver.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_Threading",
] }

[dev-dependencies]
corvid-core = { workspace = true, features = ["test-provider"] }

[lints]
workspace = true
