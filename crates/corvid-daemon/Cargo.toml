[package]
name = "corvid-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "PTY and session daemon for the Corvid terminal multiplexer"
publish = ["crates-io"]

[features]
compio = ["corvid-protocol/compio", "dep:compio", "compio/macros", "dep:futures-util"]

[dependencies]
corvid-async.workspace = true
compio = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
anyhow.workspace = true
corvid-update.workspace = true
corvid-core.workspace = true
corvid-protocol.workspace = true
dunce.workspace = true
portable-pty.workspace = true
prost.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
unicode-width.workspace = true
uuid.workspace = true
vt100.workspace = true
vte.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { workspace = true, features = ["fs", "user"] }
semver.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
corvid-core = { workspace = true, features = ["test-provider"] }

[lints]
workspace = true
