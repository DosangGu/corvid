[package]
name = "corvid-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Release installation and update support for Corvid"
publish = ["crates-io"]

[dependencies]
anyhow.workspace = true
corvid-protocol.workspace = true
hex.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[build-dependencies]
embed-resource.workspace = true

[[bin]]
name = "corvid-launch"
path = "src/bin/launch.rs"

[[bin]]
name = "corvid-desktop-launch"
path = "src/bin/desktop_launch.rs"

[[bin]]
name = "corvid-agent-deck-launch"
path = "src/bin/agent_deck_launch.rs"

[lints]
workspace = true
