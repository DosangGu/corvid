[package]
name = "corvid-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Local transport and wire protocol for Corvid"
publish = ["crates-io"]

[features]
default = ["compio", "borrowed-io"]
ansi-screen = ["dep:smol_str", "dep:unicode-segmentation", "dep:unicode-width", "dep:vte"]
compio = ["dep:compio", "dep:rustix"]
borrowed-io = ["compio"]

[dependencies]
corvid-async.workspace = true
prost.workspace = true
smol_str = { workspace = true, optional = true }
thiserror.workspace = true
unicode-segmentation = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }
uuid.workspace = true
vte = { workspace = true, optional = true }

[build-dependencies]
prost-build.workspace = true
prost-types.workspace = true
protox.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
anyhow.workspace = true
compio = { workspace = true, optional = true, features = ["fs", "net"] }
nix = { workspace = true, features = ["fs", "user", "socket"] }
rustix = { workspace = true, optional = true }
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
anyhow.workspace = true
compio = { workspace = true, optional = true, features = ["fs"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
    "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true

[lints]
workspace = true
