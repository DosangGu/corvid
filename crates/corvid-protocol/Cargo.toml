[package]
name = "corvid-protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
prost.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "time"] }

[build-dependencies]
prost-build.workspace = true
prost-types.workspace = true
protox = "=0.10.0"

[target.'cfg(target_os = "linux")'.dependencies]
anyhow.workspace = true
nix = { workspace = true, features = ["fs", "user"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["net"] }

[target.'cfg(windows)'.dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["net"] }
uuid.workspace = true
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
    "Win32_System_IO", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
