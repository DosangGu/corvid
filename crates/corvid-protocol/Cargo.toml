[package]
name = "corvid-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Local transport and wire protocol for Corvid"
publish = ["crates-io"]

[features]
default = ["tokio"]
compio = ["dep:compio"]
tokio = ["dep:tokio"]

[dependencies]
prost.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util", "time"] }
uuid.workspace = true

[build-dependencies]
prost-build.workspace = true
prost-types.workspace = true
protox.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
anyhow.workspace = true
compio = { workspace = true, optional = true, features = ["fs", "net"] }
nix = { workspace = true, features = ["fs", "user", "socket"] }
tempfile.workspace = true
tokio = { workspace = true, optional = true, features = ["net"] }

[target.'cfg(windows)'.dependencies]
anyhow.workspace = true
compio = { workspace = true, optional = true, features = ["fs"] }
tokio = { workspace = true, optional = true, features = ["net"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
    "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
corvid-async.workspace = true
anyhow.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
