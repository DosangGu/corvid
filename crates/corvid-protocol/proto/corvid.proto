syntax = "proto3";

package corvid.protocol.v1;

message Envelope {
  reserved 124;
  reserved "request_writer_handoff";
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  optional string request_id = 3;
  optional string host_id = 4;
  optional string server_epoch = 5;
  optional string subscription_id = 6;
  optional uint64 sequence = 7;

  oneof body {
    Hello hello = 10;
    HelloResult hello_result = 11;
    Ping ping = 12;
    Pong pong = 13;
    GetHost get_host = 14;
    HostInfo host_info = 15;
    GetConnectionStatus get_connection_status = 16;
    ConnectionStatus connection_status = 17;
    ListWorkspaces list_workspaces = 18;
    WorkspaceList workspace_list = 19;
    FocusAgentRequest focus_agent = 20;
    ListAgents list_agents = 21;
    AgentList agent_list = 22;
    ListClients list_clients = 23;
    ClientList client_list = 24;
    RegisterClientBinding register_client_binding = 25;
    ClientBindingRegistered client_binding_registered = 26;
    UnregisterClientBinding unregister_client_binding = 27;
    ClientBindingUnregistered client_binding_unregistered = 28;
    Attach attach = 30;
    Attached attached = 31;
    InputChunk input_chunk = 32;
    PasteBegin paste_begin = 33;
    PasteChunk paste_chunk = 34;
    PasteEnd paste_end = 35;
    ResizeViewport resize_viewport = 36;
    ViewChanged view_changed = 37;
    FrameApplied frame_applied = 38;
    Detach detach = 39;
    TerminalExited terminal_exited = 40;
    SelectView select_view = 41;
    ClaimWorkspaceWriter claim_workspace_writer = 42;
    WriterClaimed writer_claimed = 43;
    IssuePairingCode issue_pairing_code = 44;
    PairingCode pairing_code = 45;
    RedrawView redraw_view = 46;
    MoveTab move_tab = 47;
    TabMoved tab_moved = 48;
    AcknowledgeAttention acknowledge_attention = 50;
    AttentionAcknowledged attention_acknowledged = 51;
    FocusApplied focus_applied = 52;
    GetCapabilities get_capabilities = 53;
    HelloResult capabilities = 54;
    CollectHook collect_hook = 60;
    HookCollected hook_collected = 61;
    RegisterShellAgent register_shell_agent = 62;
    ShellAgentRegistered shell_agent_registered = 63;
    GetSnapshot get_snapshot = 70;
    SnapshotWatch snapshot_watch = 71;
    SnapshotBegin snapshot_begin = 72;
    SnapshotChunk snapshot_chunk = 73;
    SnapshotEnd snapshot_end = 74;
    SnapshotDelta snapshot_delta = 75;
    WatchReady watch_ready = 76;
    UpgradeDaemon upgrade_daemon = 80;
    DaemonUpgradeReady daemon_upgrade_ready = 81;
    RpcError error = 90;
    GetPresentationSlots get_presentation_slots = 100;
    PresentationSlots presentation_slots = 101;
    PairTerminal pair_terminal = 102;
    UnpairTerminal unpair_terminal = 103;
    FocusSlot focus_slot = 104;
    SlotFocused slot_focused = 105;
    EditSlotLayout edit_slot_layout = 106;
    SlotLayoutEdited slot_layout_edited = 107;
    AckPresentedAttention ack_presented_attention = 108;
    ListHosts list_hosts = 109;
    HostList host_list = 110;
    AgentResponded agent_responded = 111;
    CreateView create_view = 112;
    FocusViewAgent focus_view_agent = 113;
    ReadPanePreview read_pane_preview = 114;
    CloseView close_view = 115;
    FocusDesktopAgent focus_desktop_agent = 116;
    DesktopAgentFocused desktop_agent_focused = 117;
    GetPresentationAttention get_presentation_attention = 118;
    PresentationAttention presentation_attention = 119;
    OpenAgentDeck open_agent_deck = 120;
    AgentDeckOpened agent_deck_opened = 121;
    ReadTerminalHistory read_terminal_history = 122;
    TerminalHistory terminal_history = 123;
    DisconnectWorkspaceClients disconnect_workspace_clients = 125;
    WorkspaceClientsDisconnected workspace_clients_disconnected = 126;
    RenameView rename_view = 127;
    ViewRenamed view_renamed = 128;
  }
}

message Hello {
  optional string controller_id = 1;
  repeated uint32 supported_major_versions = 2;
  repeated string required_capabilities = 3;
}

message HelloResult {
  repeated string capabilities = 1;
  Limits limits = 2;
  string writer_policy = 3;
  // Profiles describe exact releases qualified by this daemon build.
  // Each run reports its own adapter and live collection state separately.
  repeated ProviderProfile provider_profiles = 4;
}

message Limits {
  uint32 control_frame_bytes = 1;
  uint32 command_timeout_ms = 2;
}

message RpcError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  repeated uint32 supported_major_versions = 4;
}

message Ping {}
message Pong {}
message GetHost {}
message GetCapabilities {}
message UpgradeDaemon {
  bool preserve_terminals = 1;
}

message DaemonUpgradeReady {
  // Native Unix path bytes or little-endian UTF-16 on Windows.
  bytes state_directory = 1;
}

message HostInfo {
  string host_id = 1;
  string server_epoch = 2;
}

message GetConnectionStatus {}

enum PersistenceState {
  PERSISTENCE_STATE_UNSPECIFIED = 0;
  PERSISTENCE_STATE_SAVED = 1;
  PERSISTENCE_STATE_PENDING = 2;
  PERSISTENCE_STATE_FAILED = 3;
}

enum LayoutRecovery {
  LAYOUT_RECOVERY_UNSPECIFIED = 0;
  LAYOUT_RECOVERY_NORMAL = 1;
  LAYOUT_RECOVERY_BACKUP = 2;
  LAYOUT_RECOVERY_FRESH = 3;
}

message ConnectionStatus {
  bool terminal_live = 1;
  PersistenceState persistence = 2;
  LayoutRecovery layout_recovery = 3;
  CollectorStatus collector = 4;
}

message CollectorStatus {
  uint32 healthy_runs = 1;
  uint32 not_registered_runs = 2;
  uint32 degraded_runs = 3;
  uint32 gap_detected_runs = 4;
  uint32 unsupported_runs = 5;
  CollectorTraffic traffic = 6;
}

message CollectorTraffic {
  uint64 accepted_submissions = 1;
  uint64 rejected_submissions = 2;
  uint64 connection_failures = 3;
  uint64 saturated_connections = 4;
}

message ListWorkspaces {}

message WorkspaceList {
  repeated WorkspaceInfo workspaces = 1;
}

message WorkspaceInfo {
  string workspace_id = 1;
  string label = 2;
  repeated TabInfo tabs = 3;
}

message TabInfo {
  string tab_id = 1;
  string label = 2;
  repeated string pane_ids = 3;
}

message ListAgents {}

message AgentList {
  repeated AgentInfo agents = 1;
}

message ListClients {}

message ClientList {
  repeated ClientState clients = 1;
}

message ClientState {
  string client_id = 1;
  uint64 connection_generation = 2;
  optional string terminal_id = 3;
  ViewSelection selection = 4;
  optional uint64 view_revision = 5;
  Viewport viewport = 6;
  repeated WriterLeaseState writer_leases = 7;
  repeated ClientBindingState bindings = 8;
  optional TuiInputMode input_mode = 9;
  ClientKeymap keymap = 10;
  // Kept separate from legacy exclusive workspace leases.
  PaneWriterView pane_writer_view = 11;
}

message PaneWriterView {
  string terminal_id = 1;
  ViewSelection selection = 2;
  uint64 view_revision = 3;
  Viewport viewport = 4;
  TuiInputMode input_mode = 5;
  uint64 lease_generation = 6;
}

enum TuiInputMode {
  TUI_INPUT_MODE_UNSPECIFIED = 0;
  TUI_INPUT_MODE_PASSTHROUGH = 1;
  TUI_INPUT_MODE_COMMAND = 2;
}

message ClientKeymap {
  bool tabs = 1;
  bool pairing = 2;
  bool panes = 3;
}

message ClientBindingState {
  string controller_id = 1;
  uint64 binding_revision = 2;
}

message IssuePairingCode {}

message PairingCode {
  string code = 1;
  uint32 expires_in_seconds = 2;
}

message AgentResponded {
  AgentProvider provider = 1;
}

message RedrawView {
  optional uint64 view_revision = 1;
}

message RegisterClientBinding {
  string controller_id = 1;
  string code = 2;
}

message ClientBindingRegistered {
  string client_id = 1;
  uint64 binding_revision = 2;
  uint64 commit_sequence = 3;
}

message UnregisterClientBinding {
  string controller_id = 1;
  string client_id = 2;
  optional uint64 binding_revision = 3;
}

message ClientBindingUnregistered {
  uint64 commit_sequence = 1;
}

message AcknowledgeAttention {
  string controller_id = 1;
  string agent_run_id = 2;
  string attention_id = 3;
}

message AttentionAcknowledged {
  string agent_run_id = 1;
  string attention_id = 2;
  uint64 acknowledged_unix_ms = 3;
  uint64 commit_sequence = 4;
}

message FocusAgentRequest {
  string controller_id = 1;
  string client_id = 2;
  string agent_run_id = 3;
  optional uint64 binding_revision = 4;
}

message FocusApplied {
  string client_id = 1;
  string agent_run_id = 2;
  string terminal_id = 3;
  ViewSelection selection = 4;
  uint64 view_revision = 5;
  uint64 commit_sequence = 6;
}

message GetPresentationSlots {
  optional uint32 count = 1;
  uint32 overflow_page = 2;
}

enum CompanionConnection {
  COMPANION_CONNECTION_UNSPECIFIED = 0;
  COMPANION_CONNECTION_CONNECTING = 1;
  COMPANION_CONNECTION_SYNCING = 2;
  COMPANION_CONNECTION_READY = 3;
  COMPANION_CONNECTION_OFFLINE = 4;
  COMPANION_CONNECTION_INCOMPATIBLE = 5;
  COMPANION_CONNECTION_ERROR = 6;
}

message ListHosts {}

message HostList {
  repeated PresentedHost hosts = 1;
}

message PresentedHost {
  string host_id = 1;
  oneof endpoint {
    string ssh_alias = 2;
    LocalHostEndpoint local = 3;
    string wsl_distribution = 8;
  }
  CompanionConnection connection = 4;
  optional string issue_code = 5;
  // Present together only when the companion has a ready control watch.
  optional string remote_epoch = 6;
  optional uint64 remote_sequence = 7;
}

message LocalHostEndpoint {}

message PresentedRunKey {
  string host_id = 1;
  string remote_epoch = 2;
  string agent_run_id = 3;
}

// Used only over Agent Deck's private activation/registered-Desktop connection.
message FocusDesktopAgent {
  PresentedRunKey run = 1;
}

message DesktopAgentFocused {}

// Private plugin endpoint; unavailable on daemon and companion connections.
message OpenAgentDeck {
  string host_id = 1;
  string controller_id = 2;
  bool register_desktop = 3;
}

message AgentDeckOpened {}

message GetPresentationAttention {}

message PresentedAttention {
  PresentedRunKey run = 1;
  string attention_id = 2;
  AttentionReason reason = 3;
  uint64 created_unix_ms = 4;
  AgentProvider provider = 5;
  optional InputRequestStatus request_status = 6;
  optional InputRequestKind request_kind = 7;
}

message PresentationAttention {
  string controller_id = 1;
  CompanionConnection connection = 2;
  optional string control_generation = 3;
  optional string remote_epoch = 4;
  optional uint64 remote_sequence = 5;
  repeated PresentedAttention attention = 6;
  uint32 omitted_count = 7;
}

enum RunAvailability {
  RUN_AVAILABILITY_UNSPECIFIED = 0;
  RUN_AVAILABILITY_AVAILABLE = 1;
  RUN_AVAILABILITY_CHECK_NEEDED = 2;
  RUN_AVAILABILITY_HISTORICAL = 3;
  RUN_AVAILABILITY_OFFLINE = 4;
}

message PresentedRun {
  PresentedRunKey key = 1;
  RunAvailability availability = 2;
  AgentBadge last_badge = 3;
  AgentProvider provider = 4;
  EvidenceConfidence confidence = 5;
  AgentCollection collection = 6;
  uint32 pending_requests = 7;
  uint32 unverified_requests = 8;
  uint32 unseen_attention = 9;
  optional string latest_unseen_attention_id = 10;
  optional uint64 last_response_unix_ms = 11;
  optional uint64 last_observed_unix_ms = 12;
}

message PresentedSlot {
  uint32 slot_id = 1;
  uint64 revision = 2;
  bool pinned = 3;
  PresentedRun run = 4;
  reserved 5;
}

message PresentedBinding {
  string client_id = 1;
  uint64 revision = 2;
  WezTermLocation wezterm = 3;
}

message PresentationSlots {
  string controller_id = 1;
  CompanionConnection connection = 2;
  optional string issue_code = 3;
  optional string remote_epoch = 4;
  optional uint64 remote_sequence = 5;
  optional string control_generation = 6;
  repeated PresentedSlot slots = 7;
  repeated PresentedRun overflow = 8;
  uint32 overflow_count = 9;
  repeated PresentedBinding bindings = 10;
  repeated PresentedRunKey recent_ended = 11;
  repeated PresentedRunKey suppressed = 12;
  uint32 suppressed_count = 13;
  LayoutRecovery layout_recovery = 14;
}

message PairTerminal {
  string code = 1;
  WezTermTarget wezterm = 2;
  optional string control_generation = 3;
}

message WezTermTarget {
  string gui_socket = 1;
  optional uint32 pane_id = 2;
  WezTermSelection selection = 3;
}

message WezTermSelection {
  WezTermLocation location = 1;
  uint64 process_created = 2;
  uint64 volume_id = 3;
  bytes file_id = 4;
}

message WezTermLocation {
  uint32 gui_pid = 1;
  uint32 window_id = 2;
  uint32 tab_id = 3;
  uint32 pane_id = 4;
}

message UnpairTerminal {
  string control_generation = 1;
  PresentedBinding binding = 2;
}

message PresentedSlotToken {
  uint32 slot_id = 1;
  optional uint64 revision = 2;
  PresentedRunKey run = 3;
}

message FocusSlot {
  string control_generation = 1;
  PresentedSlotToken slot = 2;
  PresentedBinding binding = 3;
}

enum LocalActivation {
  LOCAL_ACTIVATION_UNSPECIFIED = 0;
  LOCAL_ACTIVATION_MANUAL_REQUIRED = 1;
  LOCAL_ACTIVATION_ACTIVATED = 2;
  LOCAL_ACTIVATION_PANE_SELECTED_FOREGROUND_UNKNOWN = 3;
  LOCAL_ACTIVATION_UNAVAILABLE = 4;
  LOCAL_ACTIVATION_NOT_ATTEMPTED = 5;
}

message SlotFocused {
  FocusApplied remote = 1;
  LocalActivation local_activation = 2;
  WezTermLocation wezterm = 3;
}

message EditSlotLayout {
  oneof action {
    PinSlot pin = 1;
    PresentedSlotToken remove = 2;
    PresentedRunKey readd = 3;
    PlaceSlot place = 4;
    PresentedRunKey remove_overflow = 5;
  }
}

message PinSlot {
  PresentedSlotToken slot = 1;
  optional bool pinned = 2;
}

message PlaceSlot {
  PresentedSlotToken slot = 1;
  PresentedRunKey run = 2;
}

message SlotLayoutEdited {}

message AckPresentedAttention {
  string control_generation = 1;
  PresentedRunKey run = 2;
  string attention_id = 3;
}

message WriterLeaseState {
  string workspace_id = 1;
  uint64 generation = 2;
}

message GetSnapshot {
  bool include_history = 1;
}

message SnapshotWatch {
  bool include_history = 1;
}

// Snapshot frames carry the base revision in Envelope.sequence.
message SnapshotBegin {
  uint32 chunks = 1;
  repeated string capabilities = 2;
}

message SnapshotChunk {
  uint32 index = 1;
  repeated SnapshotEntity entities = 2;
  // Prior epochs are separate from the live entity graph and never receive deltas.
  repeated HistoricalRun history = 3;
}

message HistoricalRun {
  string server_epoch = 1;
  string agent_run_id = 2;
  string terminal_id = 3;
  ViewSelection last_location = 4;
  AgentProvider provider = 5;
  optional string provider_session_id = 6;
  optional string parent_run_id = 7;
  AgentLifecycle last_lifecycle = 8;
  AgentProcessState last_process = 9;
  AgentActivity last_activity = 10;
  AgentEndReason last_end_reason = 11;
  EvidenceState last_evidence = 12;
  repeated HistoricalRequest requests = 13;
  repeated AttentionState attention = 14;
  optional uint32 last_exit_code = 15;
}

message HistoricalRequest {
  string request_id = 1;
  InputRequestKind kind = 2;
  // An unresolved prior-epoch request is Unverified.
  InputRequestStatus status = 3;
}

message SnapshotEnd {}
message WatchReady {}

message SnapshotDelta {
  repeated SnapshotEntity upsert = 1;
  repeated EntityRef remove = 2;
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_WORKSPACE = 1;
  ENTITY_KIND_TERMINAL = 2;
  ENTITY_KIND_CLIENT = 3;
  ENTITY_KIND_AGENT = 4;
  ENTITY_KIND_REQUEST = 5;
  ENTITY_KIND_ATTENTION = 6;
}

message EntityRef {
  EntityKind kind = 1;
  string id = 2;
  // Request and attention entries are scoped to their agent run.
  optional string agent_run_id = 3;
}

message SnapshotEntity {
  oneof body {
    WorkspaceState workspace = 1;
    TerminalState terminal = 2;
    ClientState client = 3;
    AgentState agent = 4;
    RequestState request = 5;
    AttentionState attention = 6;
  }
}

message WorkspaceState {
  string workspace_id = 1;
  string label = 2;
  repeated TabState tabs = 3;
}

message TabState {
  string tab_id = 1;
  string label = 2;
  optional string manual_name = 4;
  // Preorder tree rooted at index zero. Split children refer to this array.
  repeated LayoutNodeState nodes = 3;
}

message LayoutNodeState {
  string title = 3;
  // Legacy pane override, omitted by daemons that synchronize all pane titles.
  optional string manual_name = 4;
  oneof body {
    string pane_id = 1;
    SplitState split = 2;
  }
}

message SplitState {
  SplitAxis axis = 1;
  repeated uint32 children = 2;
}

enum SplitAxis {
  SPLIT_AXIS_UNSPECIFIED = 0;
  SPLIT_AXIS_HORIZONTAL = 1;
  SPLIT_AXIS_VERTICAL = 2;
}

message TerminalState {
  string terminal_id = 1;
  ViewSelection location = 2;
}

message AgentState {
  AgentInfo summary = 1;
  AgentLifecycle lifecycle = 2;
  AgentActivity activity = 3;
  EvidenceState lifecycle_evidence = 4;
  EvidenceState process_evidence = 5;
  EvidenceState activity_evidence = 6;
  EvidenceState collection_evidence = 7;
  EvidenceState response_evidence = 8;
  uint32 active_turns = 9;
  uint32 active_work_items = 10;
  AgentResponse response = 11;
  optional string parent_run_id = 12;
  optional uint64 created_sequence = 13;
}

enum AgentLifecycle {
  AGENT_LIFECYCLE_UNSPECIFIED = 0;
  AGENT_LIFECYCLE_UNKNOWN = 1;
  AGENT_LIFECYCLE_LIVE = 2;
  AGENT_LIFECYCLE_ENDED = 3;
}

enum AgentActivity {
  AGENT_ACTIVITY_UNSPECIFIED = 0;
  AGENT_ACTIVITY_UNKNOWN = 1;
  AGENT_ACTIVITY_WORKING = 2;
  AGENT_ACTIVITY_AWAITING_PROMPT = 3;
  AGENT_ACTIVITY_INTERRUPTED = 4;
  AGENT_ACTIVITY_ERROR = 5;
}

enum AgentResponse {
  AGENT_RESPONSE_UNSPECIFIED = 0;
  AGENT_RESPONSE_OBSERVED = 1;
  AGENT_RESPONSE_INTERRUPTED = 2;
  AGENT_RESPONSE_FAILED = 3;
}

message EvidenceState {
  EvidenceSource source = 1;
  string source_version = 2;
  uint64 observed_unix_ms = 3;
  optional uint64 provider_unix_ms = 4;
  EvidenceConfidence confidence = 5;
  optional string uncertainty = 6;
  uint64 coverage_generation = 7;
}

enum EvidenceSource {
  EVIDENCE_SOURCE_UNSPECIFIED = 0;
  EVIDENCE_SOURCE_LAUNCH = 1;
  EVIDENCE_SOURCE_PROVIDER_HOOK = 2;
  EVIDENCE_SOURCE_PROVIDER_NOTIFY = 3;
  EVIDENCE_SOURCE_PROCESS_PROBE = 4;
  EVIDENCE_SOURCE_CHILD_EXIT = 5;
  EVIDENCE_SOURCE_COLLECTOR = 6;
}

enum EvidenceConfidence {
  EVIDENCE_CONFIDENCE_UNSPECIFIED = 0;
  EVIDENCE_CONFIDENCE_CONFIRMED = 1;
  EVIDENCE_CONFIDENCE_INFERRED = 2;
  EVIDENCE_CONFIDENCE_UNKNOWN = 3;
}

message RequestState {
  string agent_run_id = 1;
  string request_id = 2;
  InputRequestKind kind = 3;
  InputRequestStatus status = 4;
  EvidenceState evidence = 5;
}

enum InputRequestKind {
  INPUT_REQUEST_KIND_UNSPECIFIED = 0;
  INPUT_REQUEST_KIND_QUESTION = 1;
  INPUT_REQUEST_KIND_PLAN_APPROVAL = 2;
  INPUT_REQUEST_KIND_PERMISSION = 3;
}

enum InputRequestStatus {
  INPUT_REQUEST_STATUS_UNSPECIFIED = 0;
  INPUT_REQUEST_STATUS_PENDING = 1;
  INPUT_REQUEST_STATUS_RESOLVED = 2;
  INPUT_REQUEST_STATUS_CANCELLED = 3;
  INPUT_REQUEST_STATUS_UNVERIFIED = 4;
}

message AttentionState {
  string agent_run_id = 1;
  string attention_id = 2;
  AttentionReason reason = 3;
  uint64 created_unix_ms = 4;
  optional uint64 acknowledged_unix_ms = 5;
  optional string request_id = 6;
}

enum AttentionReason {
  ATTENTION_REASON_UNSPECIFIED = 0;
  ATTENTION_REASON_INPUT = 1;
  ATTENTION_REASON_RESPONSE = 2;
  ATTENTION_REASON_FAILURE = 3;
}

enum AgentProvider {
  AGENT_PROVIDER_UNSPECIFIED = 0;
  AGENT_PROVIDER_CLAUDE = 1;
  AGENT_PROVIDER_CODEX = 2;
}

enum AgentProcessState {
  AGENT_PROCESS_STATE_UNSPECIFIED = 0;
  AGENT_PROCESS_STATE_RUNNING = 1;
  AGENT_PROCESS_STATE_EXITED = 2;
  AGENT_PROCESS_STATE_UNKNOWN = 3;
}

enum AgentBadge {
  AGENT_BADGE_UNSPECIFIED = 0;
  AGENT_BADGE_UNKNOWN = 1;
  AGENT_BADGE_ENDED = 2;
  AGENT_BADGE_NEEDS_INPUT = 3;
  AGENT_BADGE_WORKING = 4;
  AGENT_BADGE_READY = 5;
  AGENT_BADGE_RESPONSE_OBSERVED = 6;
  AGENT_BADGE_INTERRUPTED = 7;
  AGENT_BADGE_ERROR = 8;
}

message ProcessIdentity {
  uint32 pid = 1;
  string boot_id = 2;
  uint64 start_ticks = 3;
  optional int32 foreground_group = 4;
}

message AgentInfo {
  string agent_run_id = 1;
  string terminal_id = 2;
  ViewSelection location = 3;
  AgentProvider provider = 4;
  AgentProcessState process = 5;
  ProcessIdentity process_identity = 6;
  uint64 process_observed_unix_ms = 7;
  optional uint32 exit_code = 8;
  AgentBadge badge = 9;
  uint32 pending_requests = 10;
  bool terminal_available = 11;
  optional string provider_session_id = 12;
  AgentCollection collection = 13;
  uint32 unverified_requests = 14;
  uint32 resolved_requests = 15;
  optional uint64 response_observed_unix_ms = 16;
  AgentEndReason end_reason = 17;
  optional string qualified_provider_version = 18;
  uint32 cancelled_requests = 19;
  ProviderAdapter adapter = 20;
  optional string parent_run_id = 21;
  optional string actor_id = 22;
  bool child_coverage_gap = 23;
}

message ProviderProfile {
  AgentProvider provider = 1;
  string version = 2;
  ProviderAdapter adapter = 3;
}

message ProviderAdapter {
  ProviderExecutionMode mode = 1;
  uint32 schema_revision = 2;
  repeated HookEvent qualified_events = 3;
  repeated ProviderCorrelation correlation = 4;
  repeated ProviderCapability capabilities = 5;
}

enum ProviderExecutionMode {
  PROVIDER_EXECUTION_MODE_UNSPECIFIED = 0;
  PROVIDER_EXECUTION_MODE_INTERACTIVE_CLI = 1;
  PROVIDER_EXECUTION_MODE_PROCESS_ONLY = 2;
  PROVIDER_EXECUTION_MODE_NOTIFY_ONLY = 3;
}

enum ProviderCorrelation {
  PROVIDER_CORRELATION_UNSPECIFIED = 0;
  PROVIDER_CORRELATION_PROCESS_INCARNATION = 1;
  PROVIDER_CORRELATION_DIRECT_CHILD = 2;
  PROVIDER_CORRELATION_SESSION = 3;
  PROVIDER_CORRELATION_TURN = 4;
  PROVIDER_CORRELATION_TOOL = 5;
  PROVIDER_CORRELATION_MANAGED_CODEX_BROKER = 6;
  PROVIDER_CORRELATION_ACTOR = 7;
}

message ProviderCapability {
  ProviderCapabilityKind kind = 1;
  ProviderQualification qualification = 2;
  string reason = 3;
}

enum ProviderCapabilityKind {
  PROVIDER_CAPABILITY_KIND_UNSPECIFIED = 0;
  PROVIDER_CAPABILITY_KIND_TURN_START = 1;
  PROVIDER_CAPABILITY_KIND_RESPONSE_BOUNDARY = 2;
  PROVIDER_CAPABILITY_KIND_EXPLICIT_QUESTION = 3;
  PROVIDER_CAPABILITY_KIND_PERMISSION_REQUEST = 4;
  PROVIDER_CAPABILITY_KIND_REQUEST_RESOLUTION = 5;
  PROVIDER_CAPABILITY_KIND_SUBAGENT_IDENTITY = 6;
  PROVIDER_CAPABILITY_KIND_REVALIDATE_CURRENT_STATE = 7;
  PROVIDER_CAPABILITY_KIND_CONTEXT_REPLACEMENT = 8;
}

enum ProviderQualification {
  PROVIDER_QUALIFICATION_UNSPECIFIED = 0;
  PROVIDER_QUALIFICATION_EXACT = 1;
  PROVIDER_QUALIFICATION_PARTIAL = 2;
  PROVIDER_QUALIFICATION_UNAVAILABLE = 3;
}

enum AgentCollection {
  AGENT_COLLECTION_UNSPECIFIED = 0;
  AGENT_COLLECTION_NOT_REGISTERED = 1;
  AGENT_COLLECTION_HEALTHY = 2;
  AGENT_COLLECTION_DEGRADED = 3;
  AGENT_COLLECTION_GAP_DETECTED = 4;
  AGENT_COLLECTION_UNSUPPORTED = 5;
}

enum AgentEndReason {
  AGENT_END_REASON_UNSPECIFIED = 0;
  AGENT_END_REASON_PROCESS_EXITED = 1;
  AGENT_END_REASON_CONTEXT_ENDED = 2;
  AGENT_END_REASON_CONTEXT_REPLACED = 3;
}

enum HookEvent {
  HOOK_EVENT_UNSPECIFIED = 0;
  HOOK_EVENT_STARTUP = 1;
  HOOK_EVENT_RESUME = 2;
  HOOK_EVENT_CLEAR = 3;
  HOOK_EVENT_COMPACT = 4;
  HOOK_EVENT_PROMPT_SUBMITTED = 5;
  HOOK_EVENT_QUESTION_STARTED = 6;
  HOOK_EVENT_QUESTION_RESULT = 7;
  HOOK_EVENT_PERMISSION_REQUESTED = 8;
  HOOK_EVENT_RESPONSE_OBSERVED = 9;
  HOOK_EVENT_CONTEXT_ENDED = 10;
  HOOK_EVENT_CONTEXT_REPLACED = 11;
  HOOK_EVENT_DELIVERY_GAP = 12;
  HOOK_EVENT_TOOL_STARTED = 13;
  HOOK_EVENT_TOOL_FINISHED = 14;
  HOOK_EVENT_TURN_INTERRUPTED = 15;
  HOOK_EVENT_RESUME_CONTEXT_ENDED = 16;
  HOOK_EVENT_PLAN_APPROVAL_STARTED = 17;
  HOOK_EVENT_PLAN_APPROVAL_RESULT = 18;
  HOOK_EVENT_SUBAGENT_STARTED = 19;
  HOOK_EVENT_SUBAGENT_RESPONSE_OBSERVED = 20;
  HOOK_EVENT_SUBAGENT_LINKED = 21;
  HOOK_EVENT_INPUT_BATCH_FINISHED = 22;
  HOOK_EVENT_NESTED_SUBAGENT_LINKED = 23;
}

message CollectHook {
  string launch_association = 1;
  AgentProvider provider = 2;
  HookEvent event = 3;
  optional string session_id = 4;
  optional string turn_id = 5;
  optional string tool_id = 6;
  optional string actor_id = 7;
  // Tool-use IDs in one prompt whose batch finished. Carries no outcome.
  repeated string finished_input_ids = 8;
  // The actor that invoked the Agent tool for a nested link.
  optional string parent_actor_id = 9;
}

message HookCollected {}

message RegisterShellAgent {
  string terminal_id = 1;
  AgentProvider provider = 2;
  bytes executable_path = 3;
}

message ShellAgentRegistered {
  string launch_association = 1;
}

enum AttachRole {
  ATTACH_ROLE_UNSPECIFIED = 0;
  ATTACH_ROLE_WRITER = 1;
  reserved 2;
  reserved "ATTACH_ROLE_OBSERVER";
}

message Viewport {
  uint32 cols = 1;
  uint32 rows = 2;
}

message Attach {
  optional string workspace_id = 1;
  Viewport viewport = 2;
  repeated string terminal_capabilities = 3;
  AttachRole requested_role = 4;
  LaunchCommand launch = 5;
  optional string tab_id = 6;
  optional string create_workspace = 7;
  optional string create_tab = 8;
  optional string pane_id = 9;
  bool take_over = 10;
  optional string expected_terminal_id = 11;
}

message LaunchCommand {
  repeated bytes argv = 1;
  optional bytes cwd = 2;
  optional AgentProvider agent_provider = 3;
}

message ViewSelection {
  string workspace_id = 1;
  string tab_id = 2;
  string pane_id = 3;
}

message Attached {
  string client_id = 1;
  uint64 connection_generation = 2;
  RouteToken route_token = 3;
  repeated string writer_leases = 4;
  ViewSelection selection = 5;
}

message RouteToken {
  string client_id = 1;
  uint64 connection_generation = 2;
  uint64 view_revision = 3;
  string terminal_id = 4;
  uint64 writer_lease_generation = 5;
}

message InputChunk {
  RouteToken route_token = 1;
  uint64 input_sequence = 2;
  bytes data = 3;
}

message PasteBegin {
  RouteToken route_token = 1;
  string paste_id = 2;
  uint64 input_sequence = 3;
}

message PasteChunk {
  string paste_id = 1;
  bytes data = 2;
}

message PasteEnd {
  string paste_id = 1;
}

message ResizeViewport {
  string client_id = 1;
  uint64 connection_generation = 2;
  Viewport viewport = 3;
}

message ViewChanged {
  uint64 view_revision = 1;
  ViewSelection selection = 2;
  RouteToken route_token = 3;
  Viewport viewport = 4;
  bool paste_discarded = 5;
}

message SelectView {
  optional uint64 expected_view_revision = 1;
  string workspace_id = 2;
  string tab_id = 3;
  string pane_id = 4;
}

message CreateView {
  optional uint64 expected_view_revision = 1;
  oneof target {
    string workspace_label = 2;
    string tab_label = 3;
    SplitAxis split_axis = 4;
    ViewSelection open_pane = 5;
  }
}

message FocusViewAgent {
  optional uint64 expected_view_revision = 1;
  string agent_run_id = 2;
  ViewSelection expected_location = 3;
}

message CloseView {
  optional uint64 expected_view_revision = 1;
  string workspace_id = 2;
  optional string tab_id = 3;
  optional string pane_id = 4;
}

message ReadPanePreview {
  optional uint64 expected_view_revision = 1;
  string pane_id = 2;
}

message RenameView {
  // Requires view_titles.v1 and the writer's current selected view.
  optional uint64 expected_view_revision = 1;
  // Legacy pane target. Daemons that synchronize all pane titles reject true.
  bool pane = 2;
  // Empty restores automatic naming for the selected tab.
  string name = 3;
}

message ViewRenamed {}

message ReadTerminalHistory {
  optional uint64 expected_view_revision = 1;
}

message DisconnectWorkspaceClients {
  optional uint64 expected_view_revision = 1;
}

message WorkspaceClientsDisconnected {
  uint32 client_count = 1;
}

message TerminalHistory {
  repeated string lines = 1;
  uint32 columns = 2;
  bool truncated = 3;
}

message ClaimWorkspaceWriter {
  string workspace_id = 1;
}

message WriterClaimed {
  string workspace_id = 1;
  uint64 generation = 2;
}

message MoveTab {
  optional uint64 expected_view_revision = 1;
  string tab_id = 2;
  string destination_workspace_id = 3;
}

message TabMoved {
  ViewSelection location = 1;
  uint64 commit_sequence = 2;
}

message FrameApplied {
  uint64 render_generation = 1;
  uint64 frame_id = 2;
}

message Detach {}

message TerminalExited {
  string terminal_id = 1;
  uint32 exit_code = 2;
  optional string signal = 3;
}

message RenderHeader {
  string host_id = 1;
  string server_epoch = 2;
  string client_id = 3;
  uint64 view_revision = 4;
  uint64 render_generation = 5;
  uint64 frame_id = 6;
  optional uint64 base_frame_id = 7;
  uint32 ansi_bytes = 8;
  PanePreviewFrame preview = 9;
}

message PanePreviewFrame {
  string pane_id = 1;
  Viewport viewport = 2;
}
