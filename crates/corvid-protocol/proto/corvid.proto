syntax = "proto3";

package corvid.protocol.v1;

message Envelope {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  optional string request_id = 3;
  optional string host_id = 4;
  optional string server_epoch = 5;
  optional string subscription_id = 6;
  optional uint64 sequence = 7;

  oneof body {
    Hello hello = 10;
    HelloResult hello_result = 11;
    Ping ping = 12;
    Pong pong = 13;
    GetHost get_host = 14;
    HostInfo host_info = 15;
    GetConnectionStatus get_connection_status = 16;
    ConnectionStatus connection_status = 17;
    ListWorkspaces list_workspaces = 18;
    WorkspaceList workspace_list = 19;
    FocusAgentRequest focus_agent = 20;
    ListAgents list_agents = 21;
    AgentList agent_list = 22;
    ListClients list_clients = 23;
    ClientList client_list = 24;
    RegisterClientBinding register_client_binding = 25;
    ClientBindingRegistered client_binding_registered = 26;
    UnregisterClientBinding unregister_client_binding = 27;
    ClientBindingUnregistered client_binding_unregistered = 28;
    Attach attach = 30;
    Attached attached = 31;
    InputChunk input_chunk = 32;
    PasteBegin paste_begin = 33;
    PasteChunk paste_chunk = 34;
    PasteEnd paste_end = 35;
    ResizeViewport resize_viewport = 36;
    ViewChanged view_changed = 37;
    FrameApplied frame_applied = 38;
    Detach detach = 39;
    TerminalExited terminal_exited = 40;
    SelectView select_view = 41;
    ClaimWorkspaceWriter claim_workspace_writer = 42;
    WriterClaimed writer_claimed = 43;
    IssuePairingCode issue_pairing_code = 44;
    PairingCode pairing_code = 45;
    RedrawView redraw_view = 46;
    AcknowledgeAttention acknowledge_attention = 50;
    AttentionAcknowledged attention_acknowledged = 51;
    FocusApplied focus_applied = 52;
    CollectHook collect_hook = 60;
    HookCollected hook_collected = 61;
    GetSnapshot get_snapshot = 70;
    SnapshotWatch snapshot_watch = 71;
    SnapshotBegin snapshot_begin = 72;
    SnapshotChunk snapshot_chunk = 73;
    SnapshotEnd snapshot_end = 74;
    SnapshotDelta snapshot_delta = 75;
    WatchReady watch_ready = 76;
    RpcError error = 90;
  }
}

message Hello {
  optional string controller_id = 1;
  repeated uint32 supported_major_versions = 2;
  repeated string required_capabilities = 3;
}

message HelloResult {
  repeated string capabilities = 1;
  Limits limits = 2;
  string writer_policy = 3;
}

message Limits {
  uint32 control_frame_bytes = 1;
  uint32 command_timeout_ms = 2;
}

message RpcError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  repeated uint32 supported_major_versions = 4;
}

message Ping {}
message Pong {}
message GetHost {}

message HostInfo {
  string host_id = 1;
  string server_epoch = 2;
}

message GetConnectionStatus {}

enum PersistenceState {
  PERSISTENCE_STATE_UNSPECIFIED = 0;
  PERSISTENCE_STATE_SAVED = 1;
  PERSISTENCE_STATE_PENDING = 2;
  PERSISTENCE_STATE_FAILED = 3;
}

enum LayoutRecovery {
  LAYOUT_RECOVERY_UNSPECIFIED = 0;
  LAYOUT_RECOVERY_NORMAL = 1;
  LAYOUT_RECOVERY_BACKUP = 2;
  LAYOUT_RECOVERY_FRESH = 3;
}

message ConnectionStatus {
  bool terminal_live = 1;
  PersistenceState persistence = 2;
  LayoutRecovery layout_recovery = 3;
}

message ListWorkspaces {}

message WorkspaceList {
  repeated WorkspaceInfo workspaces = 1;
}

message WorkspaceInfo {
  string workspace_id = 1;
  string label = 2;
  repeated TabInfo tabs = 3;
}

message TabInfo {
  string tab_id = 1;
  string label = 2;
  repeated string pane_ids = 3;
}

message ListAgents {}

message AgentList {
  repeated AgentInfo agents = 1;
}

message ListClients {}

message ClientList {
  repeated ClientState clients = 1;
}

message ClientState {
  string client_id = 1;
  uint64 connection_generation = 2;
  optional string terminal_id = 3;
  ViewSelection selection = 4;
  optional uint64 view_revision = 5;
  Viewport viewport = 6;
  repeated WriterLeaseState writer_leases = 7;
  repeated ClientBindingState bindings = 8;
}

message ClientBindingState {
  string controller_id = 1;
  uint64 binding_revision = 2;
}

message IssuePairingCode {}

message PairingCode {
  string code = 1;
  uint32 expires_in_seconds = 2;
}

message RedrawView {
  optional uint64 view_revision = 1;
}

message RegisterClientBinding {
  string controller_id = 1;
  string code = 2;
}

message ClientBindingRegistered {
  string client_id = 1;
  uint64 binding_revision = 2;
  uint64 commit_sequence = 3;
}

message UnregisterClientBinding {
  string controller_id = 1;
  string client_id = 2;
  optional uint64 binding_revision = 3;
}

message ClientBindingUnregistered {
  uint64 commit_sequence = 1;
}

message AcknowledgeAttention {
  string controller_id = 1;
  string agent_run_id = 2;
  string attention_id = 3;
}

message AttentionAcknowledged {
  string agent_run_id = 1;
  string attention_id = 2;
  uint64 acknowledged_unix_ms = 3;
  uint64 commit_sequence = 4;
}

message FocusAgentRequest {
  string controller_id = 1;
  string client_id = 2;
  string agent_run_id = 3;
  optional uint64 binding_revision = 4;
}

message FocusApplied {
  string client_id = 1;
  string agent_run_id = 2;
  string terminal_id = 3;
  ViewSelection selection = 4;
  uint64 view_revision = 5;
  uint64 commit_sequence = 6;
}

message WriterLeaseState {
  string workspace_id = 1;
  uint64 generation = 2;
}

message GetSnapshot {}
message SnapshotWatch {}

// Snapshot frames carry the base revision in Envelope.sequence.
message SnapshotBegin {
  uint32 chunks = 1;
  repeated string capabilities = 2;
}

message SnapshotChunk {
  uint32 index = 1;
  repeated SnapshotEntity entities = 2;
}

message SnapshotEnd {}
message WatchReady {}

message SnapshotDelta {
  repeated SnapshotEntity upsert = 1;
  repeated EntityRef remove = 2;
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_WORKSPACE = 1;
  ENTITY_KIND_TERMINAL = 2;
  ENTITY_KIND_CLIENT = 3;
  ENTITY_KIND_AGENT = 4;
  ENTITY_KIND_REQUEST = 5;
  ENTITY_KIND_ATTENTION = 6;
}

message EntityRef {
  EntityKind kind = 1;
  string id = 2;
  // Request and attention entries are scoped to their agent run.
  optional string agent_run_id = 3;
}

message SnapshotEntity {
  oneof body {
    WorkspaceState workspace = 1;
    TerminalState terminal = 2;
    ClientState client = 3;
    AgentState agent = 4;
    RequestState request = 5;
    AttentionState attention = 6;
  }
}

message WorkspaceState {
  string workspace_id = 1;
  string label = 2;
  repeated TabState tabs = 3;
}

message TabState {
  string tab_id = 1;
  string label = 2;
  // Preorder tree rooted at index zero. Split children refer to this array.
  repeated LayoutNodeState nodes = 3;
}

message LayoutNodeState {
  oneof body {
    string pane_id = 1;
    SplitState split = 2;
  }
}

message SplitState {
  SplitAxis axis = 1;
  repeated uint32 children = 2;
}

enum SplitAxis {
  SPLIT_AXIS_UNSPECIFIED = 0;
  SPLIT_AXIS_HORIZONTAL = 1;
  SPLIT_AXIS_VERTICAL = 2;
}

message TerminalState {
  string terminal_id = 1;
  ViewSelection location = 2;
}

message AgentState {
  AgentInfo summary = 1;
  AgentLifecycle lifecycle = 2;
  AgentActivity activity = 3;
  EvidenceState lifecycle_evidence = 4;
  EvidenceState process_evidence = 5;
  EvidenceState activity_evidence = 6;
  EvidenceState collection_evidence = 7;
  EvidenceState response_evidence = 8;
  uint32 active_turns = 9;
  uint32 active_work_items = 10;
  AgentResponse response = 11;
  optional string parent_run_id = 12;
  optional uint64 created_sequence = 13;
}

enum AgentLifecycle {
  AGENT_LIFECYCLE_UNSPECIFIED = 0;
  AGENT_LIFECYCLE_UNKNOWN = 1;
  AGENT_LIFECYCLE_LIVE = 2;
  AGENT_LIFECYCLE_ENDED = 3;
}

enum AgentActivity {
  AGENT_ACTIVITY_UNSPECIFIED = 0;
  AGENT_ACTIVITY_UNKNOWN = 1;
  AGENT_ACTIVITY_WORKING = 2;
  AGENT_ACTIVITY_AWAITING_PROMPT = 3;
  AGENT_ACTIVITY_INTERRUPTED = 4;
  AGENT_ACTIVITY_ERROR = 5;
}

enum AgentResponse {
  AGENT_RESPONSE_UNSPECIFIED = 0;
  AGENT_RESPONSE_OBSERVED = 1;
  AGENT_RESPONSE_INTERRUPTED = 2;
  AGENT_RESPONSE_FAILED = 3;
}

message EvidenceState {
  EvidenceSource source = 1;
  string source_version = 2;
  uint64 observed_unix_ms = 3;
  optional uint64 provider_unix_ms = 4;
  EvidenceConfidence confidence = 5;
  optional string uncertainty = 6;
  uint64 coverage_generation = 7;
}

enum EvidenceSource {
  EVIDENCE_SOURCE_UNSPECIFIED = 0;
  EVIDENCE_SOURCE_LAUNCH = 1;
  EVIDENCE_SOURCE_PROVIDER_HOOK = 2;
  EVIDENCE_SOURCE_PROVIDER_NOTIFY = 3;
  EVIDENCE_SOURCE_PROCESS_PROBE = 4;
  EVIDENCE_SOURCE_CHILD_EXIT = 5;
  EVIDENCE_SOURCE_COLLECTOR = 6;
}

enum EvidenceConfidence {
  EVIDENCE_CONFIDENCE_UNSPECIFIED = 0;
  EVIDENCE_CONFIDENCE_CONFIRMED = 1;
  EVIDENCE_CONFIDENCE_INFERRED = 2;
  EVIDENCE_CONFIDENCE_UNKNOWN = 3;
}

message RequestState {
  string agent_run_id = 1;
  string request_id = 2;
  InputRequestKind kind = 3;
  InputRequestStatus status = 4;
  EvidenceState evidence = 5;
}

enum InputRequestKind {
  INPUT_REQUEST_KIND_UNSPECIFIED = 0;
  INPUT_REQUEST_KIND_QUESTION = 1;
  INPUT_REQUEST_KIND_PLAN_APPROVAL = 2;
  INPUT_REQUEST_KIND_PERMISSION = 3;
}

enum InputRequestStatus {
  INPUT_REQUEST_STATUS_UNSPECIFIED = 0;
  INPUT_REQUEST_STATUS_PENDING = 1;
  INPUT_REQUEST_STATUS_RESOLVED = 2;
  INPUT_REQUEST_STATUS_CANCELLED = 3;
  INPUT_REQUEST_STATUS_UNVERIFIED = 4;
}

message AttentionState {
  string agent_run_id = 1;
  string attention_id = 2;
  AttentionReason reason = 3;
  uint64 created_unix_ms = 4;
  optional uint64 acknowledged_unix_ms = 5;
  optional string request_id = 6;
}

enum AttentionReason {
  ATTENTION_REASON_UNSPECIFIED = 0;
  ATTENTION_REASON_INPUT = 1;
  ATTENTION_REASON_RESPONSE = 2;
  ATTENTION_REASON_FAILURE = 3;
}

enum AgentProvider {
  AGENT_PROVIDER_UNSPECIFIED = 0;
  AGENT_PROVIDER_CLAUDE = 1;
  AGENT_PROVIDER_CODEX = 2;
}

enum AgentProcessState {
  AGENT_PROCESS_STATE_UNSPECIFIED = 0;
  AGENT_PROCESS_STATE_RUNNING = 1;
  AGENT_PROCESS_STATE_EXITED = 2;
  AGENT_PROCESS_STATE_UNKNOWN = 3;
}

enum AgentBadge {
  AGENT_BADGE_UNSPECIFIED = 0;
  AGENT_BADGE_UNKNOWN = 1;
  AGENT_BADGE_ENDED = 2;
  AGENT_BADGE_NEEDS_INPUT = 3;
  AGENT_BADGE_WORKING = 4;
  AGENT_BADGE_READY = 5;
  AGENT_BADGE_RESPONSE_OBSERVED = 6;
  AGENT_BADGE_INTERRUPTED = 7;
  AGENT_BADGE_ERROR = 8;
}

message ProcessIdentity {
  uint32 pid = 1;
  string boot_id = 2;
  uint64 start_ticks = 3;
  optional int32 foreground_group = 4;
}

message AgentInfo {
  string agent_run_id = 1;
  string terminal_id = 2;
  ViewSelection location = 3;
  AgentProvider provider = 4;
  AgentProcessState process = 5;
  ProcessIdentity process_identity = 6;
  uint64 process_observed_unix_ms = 7;
  optional uint32 exit_code = 8;
  AgentBadge badge = 9;
  uint32 pending_requests = 10;
  bool terminal_available = 11;
  optional string provider_session_id = 12;
  AgentCollection collection = 13;
  uint32 unverified_requests = 14;
  uint32 resolved_requests = 15;
  optional uint64 response_observed_unix_ms = 16;
  AgentEndReason end_reason = 17;
  optional string qualified_provider_version = 18;
}

enum AgentCollection {
  AGENT_COLLECTION_UNSPECIFIED = 0;
  AGENT_COLLECTION_NOT_REGISTERED = 1;
  AGENT_COLLECTION_HEALTHY = 2;
  AGENT_COLLECTION_DEGRADED = 3;
  AGENT_COLLECTION_GAP_DETECTED = 4;
  AGENT_COLLECTION_UNSUPPORTED = 5;
}

enum AgentEndReason {
  AGENT_END_REASON_UNSPECIFIED = 0;
  AGENT_END_REASON_PROCESS_EXITED = 1;
  AGENT_END_REASON_CONTEXT_ENDED = 2;
  AGENT_END_REASON_CONTEXT_REPLACED = 3;
}

enum HookEvent {
  HOOK_EVENT_UNSPECIFIED = 0;
  HOOK_EVENT_STARTUP = 1;
  HOOK_EVENT_RESUME = 2;
  HOOK_EVENT_CLEAR = 3;
  HOOK_EVENT_COMPACT = 4;
  HOOK_EVENT_PROMPT_SUBMITTED = 5;
  HOOK_EVENT_QUESTION_STARTED = 6;
  HOOK_EVENT_QUESTION_RESULT = 7;
  HOOK_EVENT_PERMISSION_REQUESTED = 8;
  HOOK_EVENT_RESPONSE_OBSERVED = 9;
  HOOK_EVENT_CONTEXT_ENDED = 10;
  HOOK_EVENT_CONTEXT_REPLACED = 11;
  HOOK_EVENT_DELIVERY_GAP = 12;
}

message CollectHook {
  string launch_association = 1;
  AgentProvider provider = 2;
  HookEvent event = 3;
  optional string session_id = 4;
  optional string turn_id = 5;
  optional string tool_id = 6;
  optional string actor_id = 7;
}

message HookCollected {}

enum AttachRole {
  ATTACH_ROLE_UNSPECIFIED = 0;
  ATTACH_ROLE_WRITER = 1;
  ATTACH_ROLE_OBSERVER = 2;
}

message Viewport {
  uint32 cols = 1;
  uint32 rows = 2;
}

message Attach {
  optional string workspace_id = 1;
  Viewport viewport = 2;
  repeated string terminal_capabilities = 3;
  AttachRole requested_role = 4;
  LaunchCommand launch = 5;
  optional string tab_id = 6;
  optional string create_workspace = 7;
  optional string create_tab = 8;
}

message LaunchCommand {
  repeated bytes argv = 1;
  optional bytes cwd = 2;
  optional AgentProvider agent_provider = 3;
}

message ViewSelection {
  string workspace_id = 1;
  string tab_id = 2;
  string pane_id = 3;
}

message Attached {
  string client_id = 1;
  uint64 connection_generation = 2;
  RouteToken route_token = 3;
  repeated string writer_leases = 4;
  ViewSelection selection = 5;
}

message RouteToken {
  string client_id = 1;
  uint64 connection_generation = 2;
  uint64 view_revision = 3;
  string terminal_id = 4;
  uint64 writer_lease_generation = 5;
}

message InputChunk {
  RouteToken route_token = 1;
  uint64 input_sequence = 2;
  bytes data = 3;
}

message PasteBegin {
  RouteToken route_token = 1;
  string paste_id = 2;
  uint64 input_sequence = 3;
}

message PasteChunk {
  string paste_id = 1;
  bytes data = 2;
}

message PasteEnd {
  string paste_id = 1;
}

message ResizeViewport {
  string client_id = 1;
  uint64 connection_generation = 2;
  Viewport viewport = 3;
}

message ViewChanged {
  uint64 view_revision = 1;
  ViewSelection selection = 2;
  RouteToken route_token = 3;
  Viewport viewport = 4;
  bool paste_discarded = 5;
}

message SelectView {
  optional uint64 expected_view_revision = 1;
  string workspace_id = 2;
  string tab_id = 3;
  string pane_id = 4;
}

message ClaimWorkspaceWriter {
  string workspace_id = 1;
}

message WriterClaimed {
  string workspace_id = 1;
  uint64 generation = 2;
}

message FrameApplied {
  uint64 render_generation = 1;
  uint64 frame_id = 2;
}

message Detach {}

message TerminalExited {
  string terminal_id = 1;
  uint32 exit_code = 2;
  optional string signal = 3;
}

message RenderHeader {
  string host_id = 1;
  string server_epoch = 2;
  string client_id = 3;
  uint64 view_revision = 4;
  uint64 render_generation = 5;
  uint64 frame_id = 6;
  optional uint64 base_frame_id = 7;
  uint32 ansi_bytes = 8;
}
