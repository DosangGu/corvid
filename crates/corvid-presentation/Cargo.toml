[package]
name = "corvid-presentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Shared presentation logic for Corvid clients"
publish = ["crates-io"]

[features]
compio-endpoints = ["corvid-companion/compio-endpoints"]

[dependencies]
corvid-async.workspace = true
compio.workspace = true
anyhow.workspace = true
corvid-companion.workspace = true
corvid-protocol = { workspace = true, features = ["compio", "borrowed-io"] }
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Pipes", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
