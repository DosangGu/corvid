[workspace]
members = ["crates/corvid-protocol", "spikes/terminal"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
crossterm = { version = "=0.29.0", default-features = false }
nix = { version = "0.31.3", default-features = false }
portable-pty = "=0.9.0"
prost = "=0.14.4"
prost-build = "=0.14.4"
prost-types = "=0.14.4"
signal-hook = "0.3.18"
thiserror = "2.0"
tempfile = "3.27"
tokio = "=1.53.3"
vt100 = { version = "=0.18.1", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
