[workspace]
members = ["spikes/terminal"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
crossterm = { version = "=0.29.0", default-features = false }
nix = { version = "0.31.3", default-features = false }
portable-pty = "=0.9.0"
signal-hook = "0.3.18"
vt100 = { version = "=0.18.1", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
