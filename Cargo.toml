[workspace]
members = [
    "crates/corvid-agent-deck-core",
    "crates/corvid-client",
    "crates/corvid-companion",
    "crates/corvid-core",
    "crates/corvid-daemon",
    "crates/corvid-desktop",
    "crates/corvid-presentation",
    "crates/corvid-protocol",
    "crates/corvid-tui",
    "crates/corvid-update",
    "deploy/cargo-desktop",
    "plugins/agent-deck",
    "spikes/terminal",
]
default-members = [
    "crates/corvid-tui",
    "crates/corvid-client",
    "crates/corvid-companion",
    "crates/corvid-core",
    "crates/corvid-daemon",
    "crates/corvid-presentation",
    "crates/corvid-protocol",
    "plugins/agent-deck",
    "spikes/terminal",
]
resolver = "3"

[workspace.package]
version = "0.3.7"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
license-file = "LICENSE"
repository = "https://github.com/DosangGu/corvid"
publish = false

[workspace.dependencies]
# Keep the registry versions of workspace crates in sync with the release version.
corvid-agent-deck = { path = "plugins/agent-deck", version = "=0.3.7", default-features = false }
corvid-agent-deck-core = { path = "crates/corvid-agent-deck-core", version = "=0.3.7" }
anyhow = "1.0"
base64 = "=0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
corvid-client = { path = "crates/corvid-client", version = "=0.3.7" }
corvid-companion = { path = "crates/corvid-companion", version = "=0.3.7" }
corvid-core = { path = "crates/corvid-core", version = "=0.3.7" }
corvid-daemon = { path = "crates/corvid-daemon", version = "=0.3.7" }
corvid-presentation = { path = "crates/corvid-presentation", version = "=0.3.7" }
corvid-protocol = { path = "crates/corvid-protocol", version = "=0.3.7" }
corvid-tui = { path = "crates/corvid-tui", version = "=0.3.7" }
corvid-update = { path = "crates/corvid-update", version = "=0.3.7" }
crossterm = { version = "=0.29.0", default-features = false }
dunce = "=1.0.5"
glob = "0.3"
gpui = { package = "gpui-ce", version = "=0.3.0", default-features = false }
gpui_platform = { package = "gpui_ce_platform", version = "=0.3.0", default-features = false }
hex = "=0.4.3"
image = { version = "0.25", default-features = false }
libc = "=0.2.191"
nix = { version = "0.31.3", default-features = false }
portable-pty = "=0.9.0"
prost = "=0.14.4"
prost-build = "=0.14.4"
prost-types = "=0.14.4"
protox = "=0.10.0"
qwertty-term-input = "=0.4.0"
resvg = { version = "=0.49.0", default-features = false }
raw-window-handle = "=0.6.2"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }
sha2 = "=0.11.1"
signal-hook = "0.4.5"
socket2 = "=0.6.5"
tar = { version = "=0.4.46", default-features = false }
tempfile = "3.27"
thiserror = "2.0"
tokio = "=1.54.1"
unicode-width = "0.2"
url = "=2.5.8"
uuid = { version = "1.29", features = ["v4", "serde"] }
vt100 = { version = "=0.18.1", default-features = false }
vte = { version = "=0.15.0", default-features = false }
windows-sys = "=0.61.2"
windows = "=0.62.2"
embed-resource = "=3.0.12"
cc = "=1.11.1"
x11rb = "=0.14.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev.package.corvid-desktop]
debug = 0

[profile.dev.package.gpui-ce]
debug = 0
